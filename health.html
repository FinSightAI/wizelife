<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>WizeHealth — מעביר…</title>
<link rel="icon" href="/favicon.svg?v=51" type="image/svg+xml">
<style>
  html,body{margin:0;padding:0;height:100%;background:#030508;color:#94a3b8;
           font-family:'Inter','Heebo',-apple-system,sans-serif;display:flex;align-items:center;justify-content:center}
  .dot{width:8px;height:8px;border-radius:50%;background:#6366f1;display:inline-block;margin:0 4px;
       animation:b 1.2s infinite ease-in-out both}
  .dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,80%,100%{transform:scale(.5);opacity:.5}40%{transform:scale(1);opacity:1}}
  .msg{font-size:13px;margin-top:14px}
</style>
</head>
<body>
<div style="text-align:center">
  <div><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  <div class="msg">WizeHealth</div>
</div>
<script>
// Forward wl_token + wl_plan + wl_nick to health.wizelife.ai so the
// destination app (vitara) knows the user's plan + identity.
// wl_token is carried in the URL fragment so it never reaches server / CF
// logs / Referer headers. We accept it from either the incoming query OR
// the incoming fragment for 30-day backward compatibility.
(function () {
  var qp = new URLSearchParams(location.search);
  var hp = new URLSearchParams((location.hash || '').replace(/^#/, ''));
  var qs = new URLSearchParams();
  // Non-sensitive — stay in query.
  ['wl_plan', 'wl_nick'].forEach(function (k) {
    var v = hp.get(k) || qp.get(k); if (v) qs.set(k, v);
  });
  var tok = hp.get('wl_token') || qp.get('wl_token');
  var base = 'https://health.wizelife.ai/';
  var TARGET = base + (qs.toString() ? '?' + qs.toString() : '') + (tok ? '#wl_token=' + encodeURIComponent(tok) : '');
  location.replace(TARGET);
})();
</script>
</body>
</html>
