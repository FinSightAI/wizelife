name: Daily QA — All Apps

# Comprehensive 13-tier QA suite + E2E flows. Runs daily at 06:00 UTC.
# Posts results to a rolling 'Daily QA Status' issue. Failures open
# a high-priority alert issue → GitHub emails you (no Gmail App Pass).

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

jobs:
  qa:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright + axe-core + Lighthouse
        run: |
          mkdir -p /tmp/qa-deps
          cd /tmp/qa-deps
          npm init -y > /dev/null
          npm install --no-save \
            playwright@1.45.0 \
            @axe-core/playwright@4.9.0 \
            @lhci/cli@0.13.0
          npx playwright install chromium --with-deps

      - name: Wake sleeping services
        run: |
          for url in https://master-backend-79jx.onrender.com/health https://vitara.onrender.com/; do
            for i in 1 2 3; do
              if curl -fsS --max-time 60 "$url" > /dev/null; then break; fi
              echo "warming $url (attempt $i)"
              sleep 15
            done
          done

      - name: Tier 1-12 — Comprehensive checks
        id: comp
        env:
          NODE_PATH: /tmp/qa-deps/node_modules
        run: |
          node qa/run-comprehensive.js
          echo "fails=$(cat /tmp/total-fails 2>/dev/null || echo 0)" >> $GITHUB_OUTPUT

      - name: Lighthouse on key pages
        id: lh
        env:
          NODE_PATH: /tmp/qa-deps/node_modules
        continue-on-error: true
        run: |
          mkdir -p /tmp/lh
          {
            echo '## Tier 2 — Lighthouse'
            echo ''
            echo '| Page | Performance | Accessibility | Best Practices | SEO |'
            echo '|---|---|---|---|---|'
          } > lighthouse-report.md
          for url in 'https://wizelife.ai/' 'https://wizelife.ai/auth.html' 'https://finsightai.github.io/finsight/' 'https://check-deal.vercel.app/'; do
            name=$(echo "$url" | sed 's|https://||;s|/|·|g')
            timeout 90 npx --prefix /tmp/qa-deps lighthouse "$url" \
              --only-categories=performance,accessibility,best-practices,seo \
              --chrome-flags="--headless --no-sandbox --disable-gpu" \
              --output=json --output-path=/tmp/lh/r.json --quiet 2>/dev/null || true
            if [ -f /tmp/lh/r.json ]; then
              p=$(node -p "Math.round((require('/tmp/lh/r.json').categories.performance?.score||0)*100)")
              a=$(node -p "Math.round((require('/tmp/lh/r.json').categories.accessibility?.score||0)*100)")
              b=$(node -p "Math.round((require('/tmp/lh/r.json').categories['best-practices']?.score||0)*100)")
              s=$(node -p "Math.round((require('/tmp/lh/r.json').categories.seo?.score||0)*100)")
              echo "| $name | $p | $a | $b | $s |" >> lighthouse-report.md
              rm -f /tmp/lh/r.json
            else
              echo "| $name | err | err | err | err |" >> lighthouse-report.md
            fi
          done

      - name: E2E flows (Tier 14)
        id: e2e
        env:
          NODE_PATH: /tmp/qa-deps/node_modules
          QA_EMAIL: ${{ secrets.QA_EMAIL }}
          QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
        continue-on-error: true
        run: |
          node qa/run-e2e.js
          echo "fails=$(cat /tmp/e2e-fails 2>/dev/null || echo 0)" >> $GITHUB_OUTPUT

      - name: Combine reports
        id: combine
        run: |
          ts=$(date -u +"%Y-%m-%d %H:%M UTC")
          {
            echo "## 📊 Daily QA — $ts"
            echo ""
            cat comprehensive-report.md 2>/dev/null || echo '_comprehensive missing_'
            echo ""
            cat lighthouse-report.md 2>/dev/null || echo '_lighthouse missing_'
            echo ""
            cat e2e-report.md 2>/dev/null || echo '_e2e missing_'
          } > combined-report.md
          comp_fails=$(cat /tmp/total-fails 2>/dev/null || echo 0)
          e2e_fails=$(cat /tmp/e2e-fails 2>/dev/null || echo 0)
          total=$((comp_fails + e2e_fails))
          echo "fails=$total" >> $GITHUB_OUTPUT
          # Use a unique random delimiter so a stray 'EOF' inside the report doesn't break the heredoc
          DELIM="GH_QA_REPORT_$(date +%s)_$RANDOM"
          {
            echo "body<<$DELIM"
            cat combined-report.md
            echo "$DELIM"
          } >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qa-report-${{ github.run_id }}
          path: |
            combined-report.md
            comprehensive-report.md
            lighthouse-report.md
            e2e-report.md
          retention-days: 30

      - name: Comment on rolling QA status issue
        uses: actions/github-script@v7
        env:
          QA_BODY: ${{ steps.combine.outputs.body }}
          QA_FAILS: ${{ steps.combine.outputs.fails }}
        with:
          script: |
            const body = process.env.QA_BODY;
            const fails = parseInt(process.env.QA_FAILS || '0', 10);
            const title = '📊 Daily QA Status — rolling log';

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'qa-rolling', per_page: 5,
            });
            let issue = issues.find(i => i.title === title);

            if (!issue) {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title,
                body: 'Rolling QA status — 13-tier comprehensive checks + E2E flows. Each run appends a comment.',
                labels: ['qa-rolling'],
              });
              issue = created;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: issue.number,
              body,
            });

            if (fails > 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: `🚨 QA failures — ${new Date().toISOString().slice(0,10)} (${fails} failing)`,
                body: body + '\n\n> Auto-opened. Reply with what to fix.',
                labels: ['qa-alert', 'bug'],
              });
            }

      - name: Fail workflow if anything failed
        if: steps.combine.outputs.fails != '0'
        run: |
          echo "Total failures: ${{ steps.combine.outputs.fails }}"
          exit 1
