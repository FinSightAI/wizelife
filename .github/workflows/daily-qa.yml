name: Daily QA — All Apps

# Comprehensive 13-tier QA suite + E2E flows. Runs daily at 06:00 UTC.
# Posts results to a rolling 'Daily QA Status' issue. Failures open
# a high-priority alert issue → GitHub emails you (no Gmail App Pass).
#
# Split into 2 parallel jobs (qa-core + qa-e2e) so Tier 14 E2E can't
# starve the rest of the suite of its 30-min budget. qa-finalize then
# merges both reports and posts a single issue comment.

on:
  schedule:
    # 03:00 UTC = 06:00 Israel during IDT (Mar-Oct) / 05:00 during IST (winter).
    # GitHub Actions cron is UTC-only and doesn't observe DST, so winter runs
    # arrive an hour earlier than nominal — acceptable for a pre-launch QA cron.
    - cron: '0 3 * * *'
  workflow_dispatch: {}

jobs:
  qa-core:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright + axe-core + Lighthouse
        run: |
          mkdir -p /tmp/qa-deps
          cd /tmp/qa-deps
          npm init -y > /dev/null
          npm install --no-save \
            playwright@1.60.0 \
            @axe-core/playwright@4.10.0 \
            @lhci/cli@0.14.0
          npx playwright install chromium chromium-headless-shell --with-deps

      - name: Wake sleeping services
        run: |
          for url in https://wizetax-backend-3ol2retcla-uc.a.run.app/health https://wizehealth-3ol2retcla-uc.a.run.app/; do
            for i in 1 2 3; do
              if curl -fsS --max-time 60 "$url" > /dev/null; then break; fi
              echo "warming $url (attempt $i)"
              sleep 15
            done
          done

      - name: Tier 1-12 — Comprehensive checks
        id: comp
        env:
          NODE_PATH: /tmp/qa-deps/node_modules
        run: |
          node qa/run-comprehensive.js
          echo "fails=$(cat /tmp/total-fails 2>/dev/null || echo 0)" >> $GITHUB_OUTPUT

      - name: Lighthouse on key pages
        id: lh
        env:
          NODE_PATH: /tmp/qa-deps/node_modules
        continue-on-error: true
        run: |
          mkdir -p /tmp/lh
          {
            echo '## Tier 2 — Lighthouse'
            echo ''
            echo '| Page | Performance | Accessibility | Best Practices | SEO |'
            echo '|---|---|---|---|---|'
          } > lighthouse-report.md
          for url in 'https://wizelife.ai/' 'https://wizelife.ai/auth.html' 'https://finsightai.github.io/finsight/' 'https://check-deal.vercel.app/'; do
            name=$(echo "$url" | sed 's|https://||;s|/|·|g')
            timeout 90 npx --prefix /tmp/qa-deps lighthouse "$url" \
              --only-categories=performance,accessibility,best-practices,seo \
              --chrome-flags="--headless --no-sandbox --disable-gpu" \
              --output=json --output-path=/tmp/lh/r.json --quiet 2>/dev/null || true
            if [ -f /tmp/lh/r.json ]; then
              p=$(node -p "Math.round((require('/tmp/lh/r.json').categories.performance?.score||0)*100)")
              a=$(node -p "Math.round((require('/tmp/lh/r.json').categories.accessibility?.score||0)*100)")
              b=$(node -p "Math.round((require('/tmp/lh/r.json').categories['best-practices']?.score||0)*100)")
              s=$(node -p "Math.round((require('/tmp/lh/r.json').categories.seo?.score||0)*100)")
              echo "| $name | $p | $a | $b | $s |" >> lighthouse-report.md
              rm -f /tmp/lh/r.json
            else
              echo "| $name | err | err | err | err |" >> lighthouse-report.md
            fi
          done

      - name: Tier 13/14 — Security regression
        id: sec
        continue-on-error: true
        run: |
          node qa/security-regression.js
          echo "fails=$(cat /tmp/security-fails 2>/dev/null || echo 0)" >> $GITHUB_OUTPUT

      - name: Tier 13b/13c — Runtime health (Playwright)
        id: runtime
        env:
          NODE_PATH: /tmp/qa-deps/node_modules
        continue-on-error: true
        run: |
          node qa/runtime-health.js
          echo "fails=$(cat /tmp/runtime-fails 2>/dev/null || echo 0)" >> $GITHUB_OUTPUT

      - name: Tier 13d — Dead-handler / broken-link check
        id: handlers
        env:
          NODE_PATH: /tmp/qa-deps/node_modules
        continue-on-error: true
        run: |
          node qa/dead-handler-check.js
          echo "fails=$(cat /tmp/handler-fails 2>/dev/null || echo 0)" >> $GITHUB_OUTPUT

      - name: Tier 13e — API contract check
        id: api
        continue-on-error: true
        run: |
          node qa/api-contract-check.js
          echo "fails=$(cat /tmp/api-fails 2>/dev/null || echo 0)" >> $GITHUB_OUTPUT

      - name: Tier 13f/h/i/j — Extended checks (SW cache, DNS, rate-limit, open-redirect)
        id: extended
        continue-on-error: true
        run: |
          node qa/extended-checks.js
          echo "fails=$(cat /tmp/extended-fails 2>/dev/null || echo 0)" >> $GITHUB_OUTPUT

      - name: Tier 13l/m — Static extras (secret scan + cookie audit)
        id: staticextra
        continue-on-error: true
        run: |
          node qa/static-extra.js
          echo "fails=$(cat /tmp/static-extra-fails 2>/dev/null || echo 0)" >> $GITHUB_OUTPUT

      - name: Tier 15 — Core Web Vitals (LCP/CLS/INP budgets, mobile)
        id: webvitals
        continue-on-error: true
        run: node qa/web-vitals-check.js

      - name: Tier 16 — Shared-script drift (mirror integrity)
        id: drift
        continue-on-error: true
        run: node qa/shared-script-drift-check.js

      - name: Tier 17 — Calc fuzzer (NaN/Infinity on extreme inputs)
        id: calcfuzz
        continue-on-error: true
        run: node qa/calc-fuzz-check.js

      - name: Tier 18 — JSON-LD structured-data validity
        id: jsonld
        continue-on-error: true
        run: node qa/jsonld-check.js

      - name: Tier 19 — AI safety harness (adversarial prompts)
        id: aisafety
        continue-on-error: true
        run: node qa/ai-safety-check.js

      - name: Tier 20 — Cloud-backup round-trip integrity
        id: cloudbackup
        continue-on-error: true
        run: node qa/cloud-backup-roundtrip-check.js

      - name: "Tier 21 — AI health (POSITIVE: AI returns correct results)"
        id: aihealth
        continue-on-error: true
        run: node qa/ai-health-check.js

      - name: Tier 22 — Mobile integration (POSITIVE core-action flows)
        id: mobileinteg
        continue-on-error: true
        run: node qa/mobile-integration.qa.js

      - name: "Tier 23 — AI authed-smoke (POSITIVE: each AI alive, on-topic, disclaims)"
        id: aismoke
        continue-on-error: true
        env:
          QA_EMAIL: ${{ secrets.QA_EMAIL }}
          QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
        run: node qa/ai-authed-smoke.js

      - name: Aggregate core fail counts
        id: core-fails
        run: |
          comp_fails=$(cat /tmp/total-fails 2>/dev/null || echo 0)
          sec_fails=$(cat /tmp/security-fails 2>/dev/null || echo 0)
          runtime_fails=$(cat /tmp/runtime-fails 2>/dev/null || echo 0)
          handler_fails=$(cat /tmp/handler-fails 2>/dev/null || echo 0)
          api_fails=$(cat /tmp/api-fails 2>/dev/null || echo 0)
          extended_fails=$(cat /tmp/extended-fails 2>/dev/null || echo 0)
          static_extra_fails=$(cat /tmp/static-extra-fails 2>/dev/null || echo 0)
          # Positive/health tiers (15-22): a failed step counts toward the ALERT so a
          # silent outage (e.g. dead AI → ai-health fail, broken core flow → mobile-integration fail) emails us.
          new_fails=0
          for o in "${{ steps.aihealth.outcome }}" "${{ steps.aismoke.outcome }}" "${{ steps.mobileinteg.outcome }}" "${{ steps.drift.outcome }}" "${{ steps.jsonld.outcome }}" "${{ steps.calcfuzz.outcome }}"; do
            [ "$o" = "failure" ] && new_fails=$((new_fails+1))
          done
          total=$((comp_fails + sec_fails + runtime_fails + handler_fails + api_fails + extended_fails + static_extra_fails + new_fails))
          echo "fails=$total" >> $GITHUB_OUTPUT
          echo "$total" > /tmp/core-fails-total

      - name: Upload core artifact
        uses: actions/upload-artifact@v4
        with:
          name: qa-core-${{ github.run_id }}
          path: |
            comprehensive-report.md
            lighthouse-report.md
            security-report.md
            runtime-report.md
            dead-handler-report.md
            api-contract-report.md
            extended-report.md
            static-extra-report.md
            web-vitals-report.md
            shared-script-drift-report.md
            calc-fuzz-report.md
            jsonld-report.md
            ai-safety-report.md
            cloud-backup-roundtrip-report.md
            ai-health-report.md
            ai-authed-smoke-report.md
            mobile-integration-report.md
            /tmp/core-fails-total
          retention-days: 30
          if-no-files-found: warn

  qa-e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ['0', '1', '2']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright + axe-core
        run: |
          mkdir -p /tmp/qa-deps
          cd /tmp/qa-deps
          npm init -y > /dev/null
          npm install --no-save \
            playwright@1.60.0 \
            @axe-core/playwright@4.10.0
          npx playwright install chromium chromium-headless-shell --with-deps

      - name: Wake sleeping services
        run: |
          for url in https://wizetax-backend-3ol2retcla-uc.a.run.app/health https://wizehealth-3ol2retcla-uc.a.run.app/; do
            for i in 1 2 3; do
              if curl -fsS --max-time 60 "$url" > /dev/null; then break; fi
              echo "warming $url (attempt $i)"
              sleep 15
            done
          done

      - name: E2E flows (Tier 14) — shard ${{ matrix.shard }}/3
        id: e2e
        env:
          NODE_PATH: /tmp/qa-deps/node_modules
          QA_EMAIL: ${{ secrets.QA_EMAIL }}
          QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
          E2E_SHARD: ${{ matrix.shard }}
          E2E_SHARDS: '3'
        continue-on-error: true
        run: |
          node qa/run-e2e.js
          mv e2e-report.md "e2e-report-shard${{ matrix.shard }}.md" 2>/dev/null || true
          echo "$(cat /tmp/e2e-fails 2>/dev/null || echo 0)" > "e2e-fails-shard${{ matrix.shard }}.txt"

      - name: Tier 13k — Integration suite (Playwright, all 6 apps) [shard 0 only]
        if: ${{ matrix.shard == '0' }}
        id: integration
        env:
          NODE_PATH: /tmp/qa-deps/node_modules
        continue-on-error: true
        run: |
          node qa/integration-suite.js
          echo "$(cat /tmp/integration-fails 2>/dev/null || echo 0)" > integration-fails.txt

      - name: Tier 13n-s — Browser extras (i18n, layout-diff, cross-browser, PWA, auth E2E, SSO) [shard 0 only]
        if: ${{ matrix.shard == '0' }}
        id: browserextra
        env:
          NODE_PATH: /tmp/qa-deps/node_modules
          QA_EMAIL: ${{ secrets.QA_EMAIL }}
          QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
        continue-on-error: true
        run: |
          # WebKit isn't preinstalled — best-effort, skip silently if missing
          npx --prefix /tmp/qa-deps playwright install webkit --with-deps 2>/dev/null || true
          node qa/browser-extra.js
          echo "$(cat /tmp/browser-extra-fails 2>/dev/null || echo 0)" > browser-extra-fails.txt

      - name: Upload e2e shard artifact
        uses: actions/upload-artifact@v4
        with:
          name: qa-e2e-${{ github.run_id }}-${{ matrix.shard }}
          path: |
            e2e-report-shard${{ matrix.shard }}.md
            e2e-fails-shard${{ matrix.shard }}.txt
            integration-report.md
            integration-fails.txt
            browser-extra-report.md
            browser-extra-fails.txt
          retention-days: 30
          if-no-files-found: warn

  qa-finalize:
    runs-on: ubuntu-latest
    needs: [qa-core, qa-e2e]
    if: always()
    permissions:
      issues: write
      contents: read
    steps:
      - name: Download core artifact
        uses: actions/download-artifact@v4
        with:
          name: qa-core-${{ github.run_id }}
          path: ./core-reports
        continue-on-error: true

      - name: Download e2e artifacts (all shards)
        uses: actions/download-artifact@v4
        with:
          pattern: qa-e2e-${{ github.run_id }}-*
          path: ./e2e-reports
          merge-multiple: true
        continue-on-error: true

      - name: Combine reports
        id: combine
        run: |
          ts=$(date -u +"%Y-%m-%d %H:%M UTC")
          {
            echo "## 📊 Daily QA — $ts"
            echo ""
            cat core-reports/comprehensive-report.md 2>/dev/null || echo '_comprehensive missing_'
            echo ""
            cat core-reports/lighthouse-report.md 2>/dev/null || echo '_lighthouse missing_'
            echo ""
            cat e2e-reports/e2e-report-shard*.md 2>/dev/null || echo '_e2e missing_'
            echo ""
            cat core-reports/security-report.md 2>/dev/null || echo '_security missing_'
            echo ""
            cat core-reports/runtime-report.md 2>/dev/null || echo '_runtime missing_'
            echo ""
            cat core-reports/dead-handler-report.md 2>/dev/null || echo '_handlers missing_'
            echo ""
            cat core-reports/api-contract-report.md 2>/dev/null || echo '_api missing_'
            echo ""
            cat core-reports/extended-report.md 2>/dev/null || echo '_extended missing_'
            echo ""
            cat e2e-reports/integration-report.md 2>/dev/null || echo '_integration missing_'
            echo ""
            cat core-reports/static-extra-report.md 2>/dev/null || echo '_static-extra missing_'
            echo ""
            cat core-reports/ai-health-report.md 2>/dev/null || echo '_ai-health missing_'
            echo ""
            cat core-reports/mobile-integration-report.md 2>/dev/null || echo '_mobile-integration missing_'
            echo ""
            cat core-reports/web-vitals-report.md 2>/dev/null || echo '_web-vitals missing_'
            echo ""
            cat core-reports/calc-fuzz-report.md 2>/dev/null || echo '_calc-fuzz missing_'
            echo ""
            cat core-reports/shared-script-drift-report.md 2>/dev/null || echo '_drift missing_'
            echo ""
            cat e2e-reports/browser-extra-report.md 2>/dev/null || echo '_browser-extra missing_'
          } > combined-report.md
          # GitHub UI truncates issue comments at 65k chars — trim if needed
          if [ "$(wc -c < combined-report.md)" -gt 60000 ]; then
            head -c 60000 combined-report.md > /tmp/_trimmed.md
            mv /tmp/_trimmed.md combined-report.md
            echo -e "\n\n_…report truncated to fit GitHub comment size_" >> combined-report.md
          fi
          core_fails=$(cat core-reports/core-fails-total 2>/dev/null || echo 0)
          e2e_fails=0
          for f in e2e-reports/e2e-fails-shard*.txt e2e-reports/integration-fails.txt e2e-reports/browser-extra-fails.txt; do
            [ -f "$f" ] && e2e_fails=$((e2e_fails + $(cat "$f" 2>/dev/null || echo 0)))
          done
          total=$((core_fails + e2e_fails))
          echo "fails=$total" >> $GITHUB_OUTPUT

      - name: Upload combined artifact
        uses: actions/upload-artifact@v4
        with:
          name: qa-report-${{ github.run_id }}
          path: combined-report.md
          retention-days: 30

      - name: Comment on rolling QA status issue
        uses: actions/github-script@v7
        env:
          QA_FAILS: ${{ steps.combine.outputs.fails }}
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('combined-report.md', 'utf8');
            const fails = parseInt(process.env.QA_FAILS || '0', 10);
            const title = '📊 Daily QA Status — rolling log';

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'qa-rolling', per_page: 5,
            });
            let issue = issues.find(i => i.title === title);

            if (!issue) {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title,
                body: 'Rolling QA status — 13-tier comprehensive checks + E2E flows. Each run appends a comment.',
                labels: ['qa-rolling'],
              });
              issue = created;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: issue.number,
              body,
            });

            // Rolling alert: keep at most ONE open qa-alert issue.
            // Email fires only on the FIRST failure after a passing run.
            const { data: openAlerts } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'qa-alert', per_page: 10,
            });
            const existing = openAlerts.find(i => !i.pull_request);
            const today = new Date().toISOString().slice(0,10);

            if (fails > 0) {
              const newTitle = `🚨 QA failures — ${fails} failing (last: ${today})`;
              const newBody  = '@FinSightAI — QA is failing.\n\n_Last run_: ' + today
                             + ' (' + context.runId + ')\n\n' + body
                             + '\n\n> Auto-updated. This issue stays open as long as failures persist.';
              if (existing) {
                // Edit body → does NOT trigger an email. User already has the original.
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: existing.number,
                  title: newTitle, body: newBody,
                });
                console.log(`Updated existing alert #${existing.number} (no new email)`);
              } else {
                // First failure after a clean state — open a fresh issue (1 email)
                await github.rest.issues.create({
                  owner: context.repo.owner, repo: context.repo.repo,
                  title: newTitle, body: newBody,
                  labels: ['qa-alert', 'bug'],
                  assignees: ['FinSightAI'],
                });
                console.log('Opened new alert issue (1 email).');
              }
            } else if (existing) {
              // Failures resolved → close + comment
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                body: `✅ All QA checks passed on ${today}. Auto-closing.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
              });
              console.log(`Closed alert #${existing.number} (failures resolved).`);
            }

      - name: Summary
        run: |
          echo "Total failures: ${{ steps.combine.outputs.fails }}"
          # Workflow stays green even if QA found bugs — the rolling qa-alert
          # issue is the canonical signal. This avoids GitHub's automatic
          # "workflow failed" emails on top of the issue assignment email.
