<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex,nofollow">
<script>
(function(){try{
  var t=localStorage.getItem('wl_theme');
  var isLight=t==='light';
  document.documentElement.setAttribute('data-theme',isLight?'light':'dark');
  document.documentElement.classList.add(isLight?'light':'dark');
  document.documentElement.classList.remove(isLight?'dark':'light');
  if(document.body){document.body.classList.add(isLight?'light':'dark');document.body.classList.remove(isLight?'dark':'light');}
  document.addEventListener('DOMContentLoaded',function(){
    document.body.classList.add(isLight?'light':'dark');
    document.body.classList.remove(isLight?'dark':'light');
  });
}catch(e){}})();
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>WizeLife — Unified App Design System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{min-height:100%;background:#030508}

/* ═══════════════════════════════════════════════
   WIZELIFE DESIGN SYSTEM — ONE SHELL, FIVE SOULS
   ─────────────────────────────────────────────
   Base layer:  always --bg / --bg2 / --bg3
   Accent layer: --c (tool color), swapped per product
   Typography:  Plus Jakarta Sans (headings) + Inter (body)
   Radii:       cards 18px, buttons 12px, chips 99px
   Shadows:     color-glow only, no gray drop-shadows
   Motion:      subtle transforms + glow pulses
═══════════════════════════════════════════════ */
:root{
  --bg:#060810;
  --bg2:#0d1020;
  --bg3:#141828;
  --border:rgba(255,255,255,.07);
  --border2:rgba(255,255,255,.13);
  --text:#eef2ff;
  --muted:#7280a0;
  --muted2:#a0adcc;
  --radius-card:18px;
  --radius-btn:12px;
  --ff-head:'Plus Jakarta Sans',sans-serif;
  --ff-body:'Inter',sans-serif;
  --ff-mono:'JetBrains Mono',monospace;
}

/* ── Phone Shell ── */
.phone{
  width:320px;
  background:var(--bg);
  border-radius:44px;
  border:2px solid rgba(255,255,255,.1);
  overflow:hidden;
  flex-shrink:0;
  position:relative;
  box-shadow:
    0 0 0 6px rgba(255,255,255,.03),
    0 40px 80px rgba(0,0,0,.7),
    0 0 80px -10px var(--shell-glow, rgba(99,102,241,.12));
  transition:box-shadow .4s;
}
.phone-notch{
  height:32px;background:var(--bg);
  display:flex;align-items:flex-start;justify-content:center;padding-top:6px;
  position:relative;z-index:10;
}
.phone-notch::after{
  content:'';width:88px;height:22px;
  background:rgba(0,0,0,.95);border-radius:0 0 16px 16px;
  display:block;border:1.5px solid rgba(255,255,255,.06);border-top:none;
}
.phone-screen{overflow-y:auto;scrollbar-width:none;max-height:618px}
.phone-screen::-webkit-scrollbar{display:none}
.phone-home{height:30px;background:var(--bg);display:flex;align-items:center;justify-content:center}
.phone-home::after{content:'';width:104px;height:4px;background:rgba(255,255,255,.18);border-radius:99px}

/* ── Status bar ── */
.sbar{display:flex;justify-content:space-between;align-items:center;padding:8px 22px 4px;font-size:10px;font-weight:700;color:rgba(255,255,255,.4);font-family:var(--ff-mono)}

/* ── Top chrome (same across ALL apps) ── */
.top-chrome{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 20px 14px;
  background:linear-gradient(180deg,var(--bg) 0%,transparent 100%);
  position:sticky;top:0;z-index:9;
}
.top-chrome-left{display:flex;align-items:center;gap:10px}
.app-icon{
  width:38px;height:38px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;font-size:1.1rem;
  background:color-mix(in srgb,var(--c) 18%,transparent);
  border:1px solid color-mix(in srgb,var(--c) 30%,transparent);
  flex-shrink:0;
}
.app-name{font-family:var(--ff-head);font-size:1.05rem;font-weight:800;letter-spacing:-.4px;color:var(--text)}
.app-name em{font-style:normal;color:var(--c)}
.top-right{display:flex;gap:8px}
.icon-btn{
  width:34px;height:34px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.05);border:1px solid var(--border);
  font-size:.82rem;cursor:pointer;color:var(--muted2);
  transition:all .2s;
}
.icon-btn:hover{background:rgba(255,255,255,.1);border-color:var(--border2)}

/* ── Bottom nav (same chrome) ── */
.bnav{
  display:flex;
  background:color-mix(in srgb,var(--bg2) 90%,transparent);
  backdrop-filter:blur(20px);
  border-top:1px solid var(--border);
  padding:10px 0 6px;
  position:sticky;bottom:0;
}
.bni{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.bni-ico{font-size:1.05rem;line-height:1;transition:transform .2s}
.bni.active .bni-ico{transform:scale(1.15)}
.bni-lbl{font-size:.6rem;font-weight:700;color:var(--muted);letter-spacing:.2px;transition:color .2s;font-family:var(--ff-body)}
.bni.active .bni-lbl{color:var(--c)}
.bni-pip{width:18px;height:3px;border-radius:99px;background:transparent;margin-top:3px;transition:background .2s}
.bni.active .bni-pip{background:var(--c)}

/* ── Cards ── */
.wl-card{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--radius-card);padding:16px;
  margin:0 18px 10px;
  transition:border-color .2s;
}
.wl-card.accent{
  background:color-mix(in srgb,var(--c) 7%,var(--bg2));
  border-color:color-mix(in srgb,var(--c) 25%,transparent);
}
.wl-card.glow{
  box-shadow:0 8px 32px color-mix(in srgb,var(--c) 12%,transparent);
}

/* ── Section header ── */
.sh{display:flex;justify-content:space-between;align-items:center;padding:0 18px;margin-bottom:8px}
.sh-t{font-size:.68rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-family:var(--ff-body)}
.sh-a{font-size:.72rem;font-weight:700;color:var(--c);font-family:var(--ff-body)}

/* ── Chips ── */
.chips{display:flex;gap:7px;padding:0 18px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:6px 14px;border-radius:99px;font-size:.72rem;font-weight:700;border:1px solid var(--border);background:rgba(255,255,255,.03);color:var(--muted);cursor:pointer;font-family:var(--ff-body);transition:all .2s}
.chip.on{background:color-mix(in srgb,var(--c) 14%,transparent);border-color:color-mix(in srgb,var(--c) 40%,transparent);color:var(--text)}

/* ── Metric card ── */
.metric{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 18px;margin-bottom:10px}
.met{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:12px}
.met-lbl{font-size:.62rem;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin-bottom:4px;font-family:var(--ff-body)}
.met-val{font-family:var(--ff-head);font-size:1.25rem;font-weight:900;letter-spacing:-.5px;color:var(--c);line-height:1}
.met-sub{font-size:.62rem;color:var(--muted);margin-top:3px;font-family:var(--ff-body)}
.met-bar{height:3px;background:rgba(255,255,255,.06);border-radius:99px;overflow:hidden;margin-top:6px}
.met-fill{height:100%;border-radius:99px;background:var(--c);transition:width .8s ease}

/* ── List row ── */
.lrow{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-family:var(--ff-body)}
.lrow:last-child{border:none}
.lrow-l{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.lrow-ico{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:.85rem;flex-shrink:0}
.lrow-title{font-weight:600;font-size:.84rem;color:var(--text);line-height:1.2}
.lrow-sub{font-size:.66rem;color:var(--muted);margin-top:1px}
.lrow-r{text-align:right}
.lrow-val{font-weight:700;font-size:.88rem;color:var(--text);font-family:var(--ff-mono)}
.tag{padding:2px 8px;border-radius:6px;font-size:.65rem;font-weight:800;font-family:var(--ff-mono)}
.tag.up{background:rgba(16,185,129,.13);color:#34d399}
.tag.dn{background:rgba(239,68,68,.13);color:#f87171}
.tag.neu{background:rgba(245,158,11,.13);color:#fcd34d}

/* ── AI bubble ── */
.ai-msg{padding:12px 14px;border-radius:4px 14px 14px 14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);font-size:.8rem;line-height:1.6;color:var(--muted2);margin:0 18px 8px;font-family:var(--ff-body)}
.ai-msg strong{color:var(--text)}
.ai-msg .ai-tag{font-size:.62rem;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--c);margin-bottom:5px;display:block}

/* ── Hero value block ── */
.hero-val{padding:16px 18px 4px}
.hv-lbl{font-size:.66rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-family:var(--ff-body)}
.hv-num{font-family:var(--ff-head);font-size:2.6rem;font-weight:900;letter-spacing:-2.5px;color:var(--text);line-height:1;margin:3px 0}
.hv-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:.72rem;font-weight:800;font-family:var(--ff-mono)}
.hv-badge.pos{background:rgba(16,185,129,.13);color:#34d399}
.hv-badge.warn{background:rgba(245,158,11,.13);color:#fcd34d}
.hv-badge.neg{background:rgba(239,68,68,.13);color:#f87171}
.hv-badge.info{background:color-mix(in srgb,var(--c) 12%,transparent);color:var(--c)}

/* ── Inline mini chart ── */
.sparkline{display:flex;align-items:flex-end;gap:3px;height:36px}
.spark-bar{flex:1;border-radius:3px 3px 0 0;background:color-mix(in srgb,var(--c) 22%,transparent);transition:background .2s}
.spark-bar.hi{background:color-mix(in srgb,var(--c) 55%,transparent)}
.spark-bar.now{background:var(--c)}

/* ── CTA button ── */
.cta-btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:14px;border-radius:var(--radius-btn);
  background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 70%,#a78bfa));
  color:#fff;font-family:var(--ff-head);font-weight:800;font-size:.95rem;
  cursor:pointer;
  box-shadow:0 8px 28px color-mix(in srgb,var(--c) 30%,transparent);
  border:none;transition:all .2s;
}
.cta-btn:hover{transform:translateY(-1px);box-shadow:0 12px 36px color-mix(in srgb,var(--c) 40%,transparent)}

/* ── Onboarding specific ── */
.ob-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px 24px 10px;min-height:540px}
.ob-logo{font-family:var(--ff-head);font-size:1rem;font-weight:800;letter-spacing:-.5px;margin-bottom:18px;background:linear-gradient(120deg,#6366f1 0%,#a78bfa 40%,#ec4899 75%,#f59e0b 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.ob-icon{width:76px;height:76px;border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:2.2rem;margin:0 auto 18px;
  background:color-mix(in srgb,var(--c) 14%,transparent);
  border:1.5px solid color-mix(in srgb,var(--c) 35%,transparent);
  box-shadow:0 16px 48px color-mix(in srgb,var(--c) 22%,transparent);
}
.ob-title{font-family:var(--ff-head);font-size:1.65rem;font-weight:900;letter-spacing:-1px;color:var(--text);line-height:1.05;margin-bottom:8px}
.ob-sub{font-size:.84rem;color:var(--muted2);line-height:1.6;margin-bottom:22px;font-family:var(--ff-body)}
.ob-steps{width:100%;display:flex;flex-direction:column;gap:9px;margin-bottom:22px}
.ob-step{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.035);border:1px solid var(--border);border-radius:13px;padding:10px 13px;text-align:left}
.ob-step-ico{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:.88rem;background:color-mix(in srgb,var(--c) 16%,transparent);border:1px solid color-mix(in srgb,var(--c) 28%,transparent);flex-shrink:0}
.ob-step-txt{font-size:.78rem;color:var(--muted2);font-family:var(--ff-body);line-height:1.4}
.ob-free{font-size:.72rem;color:var(--muted);margin-top:10px;font-family:var(--ff-body)}

/* ── Bottom sheet (AI drawer) ── */
.bottom-sheet-overlay{
  position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:20;
  backdrop-filter:blur(4px);opacity:0;pointer-events:none;
  transition:opacity .25s;
}
.bottom-sheet-overlay.open{opacity:1;pointer-events:all}
.bottom-sheet{
  position:absolute;bottom:0;left:0;right:0;z-index:21;
  background:var(--bg2);border-radius:20px 20px 0 0;
  border-top:1px solid var(--border2);
  padding:0 18px 18px;
  transform:translateY(100%);transition:transform .3s cubic-bezier(.16,1,.3,1);
  max-height:72%;
}
.bottom-sheet.open{transform:translateY(0)}
.bs-handle{width:36px;height:4px;border-radius:99px;background:rgba(255,255,255,.15);margin:10px auto 14px}
.bs-title{font-family:var(--ff-head);font-size:.88rem;font-weight:800;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.bs-msgs{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;max-height:180px;overflow-y:auto;scrollbar-width:none}
.bs-msgs::-webkit-scrollbar{display:none}
.bs-msg{padding:10px 12px;border-radius:4px 12px 12px 12px;background:rgba(255,255,255,.04);border:1px solid var(--border);font-size:.78rem;line-height:1.55;color:var(--muted2);font-family:var(--ff-body)}
.bs-msg strong{color:var(--text)}
.bs-input-row{display:flex;gap:8px}
.bs-input{flex:1;background:var(--bg3);border:1px solid var(--border2);border-radius:10px;padding:10px 12px;color:var(--text);font-size:.8rem;font-family:var(--ff-body);outline:none}
.bs-input:focus{border-color:color-mix(in srgb,var(--c) 55%,transparent)}
.bs-input::placeholder{color:var(--muted)}
.bs-send{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 65%,#a78bfa));display:flex;align-items:center;justify-content:center;color:#fff;font-size:.85rem;cursor:pointer;flex-shrink:0;border:none}

/* ── Lang pill ── */
.lang-bar{display:flex;gap:4px;padding:6px 18px 2px;justify-content:flex-end}
[dir=rtl] .lang-bar{justify-content:flex-start}
.lpill{padding:3px 9px;border-radius:99px;font-size:.6rem;font-weight:800;cursor:pointer;font-family:var(--ff-body);border:1px solid var(--border);background:rgba(255,255,255,.03);color:var(--muted);transition:all .15s}
.lpill.on{background:color-mix(in srgb,var(--c) 15%,transparent);border-color:color-mix(in srgb,var(--c) 35%,transparent);color:var(--c)}
.wl-input{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:11px;padding:11px 14px;color:var(--text);font-size:.88rem;font-family:var(--ff-body);outline:none;transition:border-color .2s}
.wl-input:focus{border-color:color-mix(in srgb,var(--c) 55%,transparent)}
.wl-input::placeholder{color:var(--muted)}

/* ── Chat row ── */
.chat-row{display:flex;margin-bottom:10px}
.chat-row.user{justify-content:flex-end}
.chat-bubble{max-width:82%;padding:10px 13px;font-size:.8rem;line-height:1.6;font-family:var(--ff-body);border-radius:4px 14px 14px 14px}
.chat-row.bot .chat-bubble{background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--muted2);border-radius:4px 14px 14px 14px}
.chat-row.user .chat-bubble{background:color-mix(in srgb,var(--c) 22%,transparent);border:1px solid color-mix(in srgb,var(--c) 35%,transparent);color:var(--text);border-radius:14px 4px 14px 14px}

/* ── Score grade ── */
.grade{width:58px;height:58px;border-radius:17px;display:flex;align-items:center;justify-content:center;font-family:var(--ff-head);font-size:2rem;font-weight:900;color:#fff;flex-shrink:0;
  background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 60%,#6366f1));
  box-shadow:0 8px 24px color-mix(in srgb,var(--c) 35%,transparent);
}

/* ── Step indicator ── */
.step-dots{display:flex;gap:5px;justify-content:center;margin-bottom:14px}
.sdot{width:6px;height:6px;border-radius:99px;background:var(--border2);transition:all .3s}
.sdot.on{width:20px;background:var(--c)}


/* ── Page shell (replaces DesignCanvas) ── */
.page-shell{padding:48px 24px 80px;display:flex;flex-direction:column;gap:64px;align-items:center;min-height:100vh;background:#030508}
.dc-section{display:flex;flex-direction:column;align-items:center;gap:20px;width:100%;max-width:1800px}
.dc-section-head{text-align:center;padding:0 16px;max-width:740px}
.dc-section-head h2{font-family:'Plus Jakarta Sans',sans-serif;font-size:1.6rem;font-weight:900;letter-spacing:-.5px;color:#eef2ff;margin-bottom:8px}
.dc-section-head p{font-size:.9rem;color:#a0adcc;line-height:1.55}
.dc-grid{display:flex;flex-wrap:wrap;gap:32px;justify-content:center;align-items:flex-start;padding:20px 0}
.dc-artboard{display:flex;flex-direction:column;align-items:center;gap:12px}
.dc-label{font-family:'Plus Jakarta Sans',sans-serif;font-size:.7rem;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.4)}
.page-header-bar{text-align:center;padding-bottom:16px}
.page-header-bar h1{font-family:'Plus Jakarta Sans',sans-serif;font-size:2rem;font-weight:900;letter-spacing:-1px;color:#eef2ff;margin-bottom:8px}
.page-header-bar p{font-size:.9rem;color:#a0adcc}

</style>
<style>
[data-theme="light"] { --bg:#f8fafc; --surf:#ffffff; --surf2:#f1f5f9; --text:#1e293b; --muted:#64748b; --muted2:#475569; --border:rgba(0,0,0,.08); --border2:rgba(0,0,0,.14); }
[data-theme="light"] body { background: #f8fafc !important; color: #1e293b; }
[data-theme="light"] nav { background: rgba(255,255,255,.85) !important; }
[data-theme="light"] nav.scrolled { background: rgba(255,255,255,.95) !important; }
[data-theme="light"] .nav-links a, [data-theme="light"] .nav-signin { color: #475569; }
[data-theme="light"] .hero-feed, [data-theme="light"] .feed-chip { background: rgba(0,0,0,.03); color: #475569; border-color: rgba(0,0,0,.08); }
[data-theme="light"] .trust-bar { background: #ffffff; }
[data-theme="light"] section { background: transparent; }
[data-theme="light"] .price-card, [data-theme="light"] .testi-card, [data-theme="light"] .feature-card,
[data-theme="light"] .panel, [data-theme="light"] .tool-tab { background: #ffffff; border-color: rgba(0,0,0,.08); color: #1e293b; }
[data-theme="light"] .tool-tab-name, [data-theme="light"] .panel-title, [data-theme="light"] .testi-quote, [data-theme="light"] .testi-name { color: #1e293b; }
[data-theme="light"] .tool-tab-desc, [data-theme="light"] .testi-role, [data-theme="light"] .feed-label, [data-theme="light"] .hero-sub { color: #475569; }
[data-theme="light"] .price-card.featured { background: linear-gradient(135deg, rgba(99,102,241,.05), rgba(167,139,250,.05)); }
[data-theme="light"] .faq-item, [data-theme="light"] .faq-question { background: #ffffff; border-color: rgba(0,0,0,.08); color: #1e293b; }
[data-theme="light"] footer { background: #f1f5f9; color: #475569; border-top: 1px solid rgba(0,0,0,.08); }
[data-theme="light"] footer a, [data-theme="light"] footer h4 { color: #1e293b; }

/* Theme toggle button */
.wl-theme-btn-landing {
  position: fixed; bottom: 18px; left: 18px; z-index: 9999;
  width: 38px; height: 38px; border-radius: 50%;
  background: rgba(15,23,42,0.85); backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.12);
  color: #cbd5e1; font-size: 15px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 16px rgba(0,0,0,0.25); transition: all .18s ease;
}
.wl-theme-btn-landing:hover { transform: translateY(-2px) scale(1.05); }
[data-theme="light"] .wl-theme-btn-landing {
  background: rgba(255,255,255,0.95); border-color: rgba(0,0,0,0.1);
  color: #475569; box-shadow: 0 4px 16px rgba(0,0,0,0.08);
}
</style>

const cs = (obj) => Object.entries(obj).map(([k,v])=>`${k}:${v}`).join(';');

function Phone({color, children, aiMessages}){
  const [lang, setLang] = React.useState('en');
  const [sheetOpen, setSheetOpen] = React.useState(false);
  const langs = [{k:'en',l:'EN'},{k:'he',l:'עב'},{k:'pt',l:'PT'},{k:'es',l:'ES'}];
  const isRTL = lang==='he';
  const defaultMsgs = [{t:isRTL?'שלום! אני WizeAI. שאל אותי כל דבר.':'Hi! I\'m WizeAI. Ask me anything.'}];
  return (
    <div className="phone" dir={isRTL?'rtl':'ltr'} style={{'--c':color,'--shell-glow':`color-mix(in srgb,${color} 16%,transparent)`}}>
      <div className="phone-notch"></div>
      <div className="lang-bar" style={{'--c':color}}>
        {langs.map(({k,l})=>(
          <div key={k} className={`lpill${lang===k?' on':''}`} onClick={()=>setLang(k)}>{l}</div>
        ))}
      </div>
      {children}
      <div className={`bottom-sheet-overlay${sheetOpen?' open':''}`} onClick={()=>setSheetOpen(false)}/>
      <div className={`bottom-sheet${sheetOpen?' open':''}`} style={{'--c':color}}>
        <div className="bs-handle"/>
        <div className="bs-title">
          <div style={{width:22,height:22,borderRadius:7,background:`linear-gradient(135deg,${color},color-mix(in srgb,${color} 60%,#6366f1))`,display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontSize:'.65rem',fontWeight:900}}>W</div>
          WizeAI {isRTL?'· עברית':'· EN'}
        </div>
        <div className="bs-msgs">
          {(aiMessages||defaultMsgs).map((m,i)=>(<div key={i} className="bs-msg">{m.t}</div>))}
        </div>
        <div className="bs-input-row">
          <input className="bs-input" placeholder={isRTL?'שאל אותי…':'Ask anything…'} readOnly/>
          <button className="bs-send">↑</button>
        </div>
      </div>
      <div className="phone-home" onClick={()=>setSheetOpen(o=>!o)} style={{cursor:'pointer'}}/>
    </div>
  );
}

function Sbar(){
  return <div className="sbar"><span>9:41</span><span>●●● WiFi ⚡88%</span></div>;
}

function TopChrome({appName, icon, color, actions=['🔔','⋯']}){
  return (
    <div className="top-chrome">
      <div className="top-chrome-left">
        <div className="app-icon">{icon}</div>
        <div className="app-name">Wize<em>{appName}</em></div>
      </div>
      <div className="top-right">
        {actions.map((a,i)=><div key={i} className="icon-btn">{a}</div>)}
      </div>
    </div>
  );
}

function BNav({items, active, color}){
  return (
    <div className="bnav" style={{'--c':color}}>
      {items.map((it,i)=>(
        <div key={i} className={`bni${i===active?' active':''}`}>
          <div className="bni-ico">{it.ico}</div>
          <div className="bni-lbl">{it.lbl}</div>
          <div className="bni-pip"></div>
        </div>
      ))}
    </div>
  );
}

function Onboarding({color, icon, appName, tagline, steps, stepIdx=1}){
  return (
    <Phone color={color}>
      <div className="phone-screen" style={{background:'var(--bg)'}}>
        <Sbar/>

          <div className="ob-free">No credit card · cancel anytime</div>
