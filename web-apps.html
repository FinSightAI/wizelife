<!DOCTYPE html>
<html lang="en">
<head>
<script>
(function(){try{
  var t=localStorage.getItem('wl_theme');
  var isLight=t==='light';
  document.documentElement.setAttribute('data-theme',isLight?'light':'dark');
  document.documentElement.classList.add(isLight?'light':'dark');
  document.documentElement.classList.remove(isLight?'dark':'light');
  if(document.body){document.body.classList.add(isLight?'light':'dark');document.body.classList.remove(isLight?'dark':'light');}
  document.addEventListener('DOMContentLoaded',function(){
    document.body.classList.add(isLight?'light':'dark');
    document.body.classList.remove(isLight?'dark':'light');
  });
}catch(e){}})();
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>WizeLife — Web App Designs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:#030508}

/* ── Page shell ── */
.page-shell{padding:48px 24px 80px;display:flex;flex-direction:column;gap:72px;align-items:center}
.app-section{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%;max-width:1260px}
.app-label{font-family:'Plus Jakarta Sans',sans-serif;font-size:.72rem;font-weight:800;letter-spacing:2.5px;text-transform:uppercase;color:rgba(255,255,255,.35)}
.page-header-bar{text-align:center;padding:0 0 24px}
.page-header-bar h1{font-family:'Plus Jakarta Sans',sans-serif;font-size:2rem;font-weight:900;letter-spacing:-1px;color:#eef2ff;margin-bottom:8px}
.page-header-bar p{color:#7280a0;font-family:'Inter',sans-serif;font-size:.95rem}
.browser-wrap{width:100%;overflow-x:auto;padding-bottom:8px}

:root{
  --bg:#060810;--bg2:#0d1020;--bg3:#141828;
  --border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.13);
  --text:#eef2ff;--muted:#7280a0;--muted2:#a0adcc;
  --ff-head:'Plus Jakarta Sans',sans-serif;
  --ff-body:'Inter',sans-serif;
  --ff-mono:'JetBrains Mono',monospace;
}

/* ── Browser chrome ── */
.browser{
  width:1200px;border-radius:14px;overflow:hidden;
  background:var(--bg);
  border:1.5px solid rgba(255,255,255,.1);
  box-shadow:0 40px 100px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.04) inset,
    0 0 80px -10px var(--shell-glow,rgba(99,102,241,.1));
  flex-shrink:0;
}
.browser-bar{
  height:44px;background:var(--bg3);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;padding:0 16px;
}
.browser-dots{display:flex;gap:6px}
.browser-dot{width:12px;height:12px;border-radius:50%}
.browser-url{flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:7px;padding:5px 14px;font-family:var(--ff-mono);font-size:.72rem;color:var(--muted);display:flex;align-items:center;gap:6px;max-width:400px;margin:0 auto}
.browser-url .lock{color:#34d399;font-size:.65rem}
.browser-body{display:flex;height:680px}

/* ── Sidebar ── */
.sidebar{
  width:220px;background:var(--bg2);border-right:1px solid var(--border);
  display:flex;flex-direction:column;flex-shrink:0;
}
.sidebar-logo{padding:20px 20px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
.sidebar-wordmark{font-family:var(--ff-head);font-size:1.05rem;font-weight:900;letter-spacing:-.5px;background:linear-gradient(120deg,#6366f1 0%,#a78bfa 40%,#ec4899 75%,#f59e0b 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sidebar-nav{flex:1;padding:14px 10px;display:flex;flex-direction:column;gap:3px;overflow-y:auto;scrollbar-width:none}
.sidebar-nav::-webkit-scrollbar{display:none}
.snav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;font-size:.84rem;font-weight:600;color:var(--muted);font-family:var(--ff-body);transition:all .2s;border:1px solid transparent}
.snav-item:hover{background:rgba(255,255,255,.04);color:var(--text)}
.snav-item.active{background:color-mix(in srgb,var(--c) 12%,transparent);border-color:color-mix(in srgb,var(--c) 22%,transparent);color:var(--text)}
.snav-icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.85rem;flex-shrink:0;background:color-mix(in srgb,var(--c) 14%,transparent)}
.snav-item.active .snav-icon{background:color-mix(in srgb,var(--c) 22%,transparent)}
.snav-section{font-size:.62rem;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--muted);padding:12px 10px 4px;font-family:var(--ff-body)}
.sidebar-footer{padding:14px 10px;border-top:1px solid var(--border)}
.user-pill{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid var(--border)}
.user-avatar{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 60%,#6366f1));display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:900;color:#fff;flex-shrink:0}
.user-name{font-size:.78rem;font-weight:600;color:var(--muted2);font-family:var(--ff-body)}
.user-plan{font-size:.6rem;font-weight:700;color:var(--c);letter-spacing:.5px}

/* ── Right panel ── */
.rpanel{
  width:260px;flex-shrink:0;
  background:var(--bg2);border-left:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
}
.rpanel.collapsed{width:36px}
.rpanel.collapsed .rp-content{opacity:0;pointer-events:none}
.rpanel.collapsed .rp-toggle{transform:rotate(180deg)}
.rp-header{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid var(--border);flex-shrink:0}
.rp-title{font-size:.72rem;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-family:var(--ff-body);white-space:nowrap;overflow:hidden}
.rp-toggle{width:22px;height:22px;border-radius:6px;background:rgba(255,255,255,.04);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);font-size:.65rem;flex-shrink:0;transition:transform .25s}
.rp-content{flex:1;overflow-y:auto;scrollbar-width:none;padding:14px;display:flex;flex-direction:column;gap:12px;transition:opacity .2s}
.rp-content::-webkit-scrollbar{display:none}
.rp-widget{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:12px}
.rp-widget-title{font-size:.62rem;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:10px;font-family:var(--ff-body)}
.rp-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:.78rem}
.rp-row:last-child{border:none}
.rp-key{color:var(--muted);font-family:var(--ff-body)}
.rp-val{font-family:var(--ff-mono);font-weight:700;color:var(--text);font-size:.78rem}
.rp-cmsg{font-size:.76rem;line-height:1.55;color:var(--muted2);padding:9px 11px;border-radius:4px 10px 10px 10px;background:rgba(255,255,255,.03);border:1px solid var(--border);font-family:var(--ff-body);margin-bottom:8px}
.rp-cmsg strong{color:var(--text)}
.rp-cmsg .rp-tag{font-size:.6rem;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--c);display:block;margin-bottom:4px}
.rp-input{width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:8px;padding:8px 10px;color:var(--text);font-size:.78rem;font-family:var(--ff-body);outline:none;margin-top:4px}
.rp-input::placeholder{color:var(--muted)}
.rp-input:focus{border-color:color-mix(in srgb,var(--c) 55%,transparent)}
.rp-mini-bar{height:3px;background:rgba(255,255,255,.06);border-radius:99px;overflow:hidden;margin-top:5px}
.rp-mini-fill{height:100%;border-radius:99px;background:var(--c)}
.rp-pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:.62rem;font-weight:800;font-family:var(--ff-mono)}
.rp-pill.pos{background:rgba(16,185,129,.12);color:#34d399}
.rp-pill.neg{background:rgba(239,68,68,.12);color:#f87171}
.rp-pill.neu{background:rgba(245,158,11,.12);color:#fcd34d}
.rp-pill.info{background:color-mix(in srgb,var(--c) 12%,transparent);color:var(--c)}

/* ── Main content ── */
.main{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent;background:var(--bg)}
.main::-webkit-scrollbar{width:4px}
.main::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}

/* ── Page header ── */
.page-header{padding:28px 32px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(16px);z-index:9;border-bottom:1px solid var(--border)}
.page-title{font-family:var(--ff-head);font-size:1.4rem;font-weight:900;letter-spacing:-.6px;color:var(--text)}
.page-actions{display:flex;gap:8px}
.btn{padding:8px 16px;border-radius:9px;font-size:.8rem;font-weight:700;cursor:pointer;border:none;font-family:var(--ff-body);transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.btn-ghost{background:rgba(255,255,255,.04);border:1px solid var(--border2);color:var(--muted2)}
.btn-ghost:hover{background:rgba(255,255,255,.08)}
.btn-accent{background:color-mix(in srgb,var(--c) 18%,transparent);border:1px solid color-mix(in srgb,var(--c) 35%,transparent);color:var(--c)}
.btn-accent:hover{background:var(--c);color:#fff}
.btn-primary{background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 65%,#a78bfa));color:#fff;box-shadow:0 4px 16px color-mix(in srgb,var(--c) 25%,transparent)}

/* ── Content grid ── */
.content{padding:24px 32px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
.grid-2-1{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:20px}

/* ── Stat card ── */
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:18px}
.stat-card.accent{background:color-mix(in srgb,var(--c) 6%,var(--bg2));border-color:color-mix(in srgb,var(--c) 22%,transparent)}
.sc-eyebrow{font-size:.65rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-family:var(--ff-body)}
.sc-val{font-family:var(--ff-head);font-size:1.9rem;font-weight:900;letter-spacing:-1.5px;color:var(--text);line-height:1}
.sc-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:.66rem;font-weight:800;font-family:var(--ff-mono);margin-top:6px}
.sc-badge.pos{background:rgba(16,185,129,.12);color:#34d399}
.sc-badge.neg{background:rgba(239,68,68,.12);color:#f87171}
.sc-badge.neu{background:rgba(245,158,11,.12);color:#fcd34d}
.sc-badge.info{background:color-mix(in srgb,var(--c) 12%,transparent);color:var(--c)}

/* ── Table ── */
.wl-table{width:100%;border-collapse:collapse;font-family:var(--ff-body)}
.wl-table th{font-size:.68rem;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--muted);padding:10px 14px;text-align:left;border-bottom:1px solid var(--border)}
.wl-table td{padding:11px 14px;border-bottom:1px solid var(--border);font-size:.84rem;color:var(--muted2);vertical-align:middle}
.wl-table tr:last-child td{border-bottom:none}
.wl-table tr:hover td{background:rgba(255,255,255,.02)}
.wl-table td:first-child{color:var(--text);font-weight:600}

/* ── Sparkline ── */
.sparkline-h{display:flex;align-items:flex-end;gap:3px;height:40px}
.spark-b{flex:1;border-radius:3px 3px 0 0;background:color-mix(in srgb,var(--c) 20%,transparent)}
.spark-b.hi{background:color-mix(in srgb,var(--c) 50%,transparent)}
.spark-b.now{background:var(--c)}

/* ── Panel ── */
.panel{background:var(--bg2);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.panel-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.panel-title{font-family:var(--ff-head);font-size:.9rem;font-weight:800;letter-spacing:-.3px;color:var(--text)}
.panel-body{padding:14px 18px}

/* ── AI chat ── */
.chat-messages{padding:14px 18px;display:flex;flex-direction:column;gap:10px;min-height:120px}
.cmsg{max-width:80%;padding:10px 13px;font-size:.8rem;line-height:1.55;font-family:var(--ff-body);border-radius:4px 12px 12px 12px;border:1px solid var(--border);background:rgba(255,255,255,.03);color:var(--muted2)}
.cmsg.user{align-self:flex-end;background:color-mix(in srgb,var(--c) 14%,transparent);border-color:color-mix(in srgb,var(--c) 30%,transparent);color:var(--text);border-radius:12px 4px 12px 12px}
.cmsg strong{color:var(--text)}
.chat-input-row{display:flex;gap:8px;padding:10px 18px;border-top:1px solid var(--border)}
.chat-input{flex:1;background:var(--bg3);border:1px solid var(--border2);border-radius:9px;padding:9px 13px;color:var(--text);font-size:.84rem;font-family:var(--ff-body);outline:none}
.chat-input:focus{border-color:color-mix(in srgb,var(--c) 55%,transparent)}
.chat-input::placeholder{color:var(--muted)}

/* ── Progress ── */
.prog{height:5px;background:rgba(255,255,255,.06);border-radius:99px;overflow:hidden;margin-top:8px}
.prog-fill{height:100%;border-radius:99px;background:var(--c)}

/* ── Tag ── */
.tag{padding:2px 8px;border-radius:6px;font-size:.66rem;font-weight:800;font-family:var(--ff-mono);display:inline-block}
.tag.up{background:rgba(16,185,129,.12);color:#34d399}
.tag.dn{background:rgba(239,68,68,.12);color:#f87171}
.tag.neu{background:rgba(245,158,11,.12);color:#fcd34d}
.tag.info{background:color-mix(in srgb,var(--c) 12%,transparent);color:var(--c)}

/* ── Grade badge ── */
.grade{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-family:var(--ff-head);font-size:1.4rem;font-weight:900;color:#fff;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 60%,#6366f1));box-shadow:0 6px 18px color-mix(in srgb,var(--c) 30%,transparent);flex-shrink:0}
</style>
<style>
[data-theme="light"] { --bg:#f8fafc; --surf:#ffffff; --surf2:#f1f5f9; --text:#1e293b; --muted:#64748b; --muted2:#475569; --border:rgba(0,0,0,.08); --border2:rgba(0,0,0,.14); }
[data-theme="light"] body { background: #f8fafc !important; color: #1e293b; }
[data-theme="light"] nav { background: rgba(255,255,255,.85) !important; }
[data-theme="light"] nav.scrolled { background: rgba(255,255,255,.95) !important; }
[data-theme="light"] .nav-links a, [data-theme="light"] .nav-signin { color: #475569; }
[data-theme="light"] .hero-feed, [data-theme="light"] .feed-chip { background: rgba(0,0,0,.03); color: #475569; border-color: rgba(0,0,0,.08); }
[data-theme="light"] .trust-bar { background: #ffffff; }
[data-theme="light"] section { background: transparent; }
[data-theme="light"] .price-card, [data-theme="light"] .testi-card, [data-theme="light"] .feature-card,
[data-theme="light"] .panel, [data-theme="light"] .tool-tab { background: #ffffff; border-color: rgba(0,0,0,.08); color: #1e293b; }
[data-theme="light"] .tool-tab-name, [data-theme="light"] .panel-title, [data-theme="light"] .testi-quote, [data-theme="light"] .testi-name { color: #1e293b; }
[data-theme="light"] .tool-tab-desc, [data-theme="light"] .testi-role, [data-theme="light"] .feed-label, [data-theme="light"] .hero-sub { color: #475569; }
[data-theme="light"] .price-card.featured { background: linear-gradient(135deg, rgba(99,102,241,.05), rgba(167,139,250,.05)); }
[data-theme="light"] .faq-item, [data-theme="light"] .faq-question { background: #ffffff; border-color: rgba(0,0,0,.08); color: #1e293b; }
[data-theme="light"] footer { background: #f1f5f9; color: #475569; border-top: 1px solid rgba(0,0,0,.08); }
[data-theme="light"] footer a, [data-theme="light"] footer h4 { color: #1e293b; }

/* Theme toggle button */
.wl-theme-btn-landing {
  position: fixed; bottom: 18px; left: 18px; z-index: 9999;
  width: 38px; height: 38px; border-radius: 50%;
  background: rgba(15,23,42,0.85); backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.12);
  color: #cbd5e1; font-size: 15px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 16px rgba(0,0,0,0.25); transition: all .18s ease;
}
.wl-theme-btn-landing:hover { transform: translateY(-2px) scale(1.05); }
[data-theme="light"] .wl-theme-btn-landing {
  background: rgba(255,255,255,0.95); border-color: rgba(0,0,0,0.1);
  color: #475569; box-shadow: 0 4px 16px rgba(0,0,0,0.08);
}
</style>
</head>
<body>
<div id="root"></div>
<script  src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script  src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script  src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel">

function RightPanel({title, color, children}){
  const [open, setOpen] = React.useState(true);
  return (
    <div className={`rpanel${open?'':' collapsed'}`} style={{'--c':color}}>
      <div className="rp-header">
        {open && <div className="rp-title">{title}</div>}
        <div className="rp-toggle" onClick={()=>setOpen(o=>!o)}>{open?'»':'«'}</div>
      </div>
      <div className="rp-content">{children}</div>
    </div>
  );
}

function Browser({color, url, children}){
  const [lang, setLang] = React.useState('en');
  const langs = ['en','he','pt','es'];
  const labels = {en:'EN',he:'עב',pt:'PT',es:'ES'};
  return (
    <div className="browser" dir={lang==='he'?'rtl':'ltr'} style={{'--c':color,'--shell-glow':`color-mix(in srgb,${color} 14%,transparent)`}}>
      <div className="browser-bar">
        <div className="browser-dots">
          <div className="browser-dot" style={{background:'#ff5f57'}}/>
          <div className="browser-dot" style={{background:'#febc2e'}}/>
          <div className="browser-dot" style={{background:'#28c840'}}/>
        </div>
        <div className="browser-url">
          <span className="lock">🔒</span>
          <span>{url}</span>
        </div>
        <div style={{display:'flex',gap:4,marginLeft:'auto'}}>
          {langs.map(l=>(
            <div key={l} onClick={()=>setLang(l)} style={{padding:'3px 8px',borderRadius:6,fontSize:'.65rem',fontWeight:800,cursor:'pointer',background:l===lang?`color-mix(in srgb,${color} 18%,transparent)`:'rgba(255,255,255,.04)',border:`1px solid ${l===lang?`color-mix(in srgb,${color} 40%,transparent)`:'rgba(255,255,255,.07)'}`,color:l===lang?color:'var(--muted)',fontFamily:'var(--ff-body)',transition:'all .15s'}}>{labels[l]}</div>
          ))}
        </div>
      </div>
      <div className="browser-body" style={{'--c':color}}>
        {children}
      </div>
    </div>
  );
}

function Sidebar({items, active, color}){
  return (
    <div className="sidebar" style={{'--c':color}}>
      <div className="sidebar-logo">
        <div className="sidebar-wordmark">WizeLife</div>
      </div>
      <nav className="sidebar-nav">
        {items.map((it,i)=>(
          <div key={i}>
            {it.section && <div className="snav-section">{it.section}</div>}
            {it.label && (
              <div className={`snav-item${i===active?' active':''}`}>
                <div className="snav-icon">{it.ico}</div>
                <span>{it.label}</span>
              </div>
            )}
          </div>
        ))}
      </nav>
      <div className="sidebar-footer">
        <div className="user-pill" style={{'--c':color}}>
          <div className="user-avatar">YR</div>
          <div>
            <div className="user-name">Yotam R.</div>
            <div className="user-plan">Pro plan</div>
          </div>
        </div>
      </div>
    </div>
  );
}
