<script>
(function(){try{
 // Unified language: URL ?lang (cross-app handoff) → saved wl_lang → browser → English.
 var _V=['he','en','pt','es'];
 var _u=new URLSearchParams(location.search).get('lang');
 if(_u&&_V.indexOf(_u)>=0){localStorage.setItem('wl_lang',_u);}
 else if(!localStorage.getItem('wl_lang')){var _bl=(navigator.language||'en').slice(0,2).toLowerCase();localStorage.setItem('wl_lang',(['he','pt','es'].indexOf(_bl)>=0)?_bl:'en');}
 var t=localStorage.getItem('wl_theme');
 var isLight=t==='light';
 document.documentElement.setAttribute('data-theme',isLight?'light':'dark');
 document.documentElement.classList.add(isLight?'light':'dark');
 document.documentElement.classList.remove(isLight?'dark':'light');
 if(document.body){document.body.classList.add(isLight?'light':'dark');document.body.classList.remove(isLight?'dark':'light');}
 document.addEventListener('DOMContentLoaded',function(){
 document.body.classList.add(isLight?'light':'dark');
 document.body.classList.remove(isLight?'dark':'light');
 });
 // Apply saved language direction before paint to prevent RTL flash for non-Hebrew users.
 var v = (localStorage.getItem('wl_lang') || 'he').slice(0,2);
 if(['he','en','pt','es'].indexOf(v)>=0){
 document.documentElement.dir = (v==='he') ? 'rtl' : 'ltr';
 document.documentElement.lang = v;
 }
}catch(e){console.error(e);}})();
</script>

<script>
 // The Sign In / Create Account buttons ship disabled and are enabled here, at the
 // first line of the script that defines their handlers. Function declarations below
 // (emailLogin/emailSignup) are hoisted, so they already exist at this point — this
 // closes a rare "emailLogin is not defined" race where a user on a slow connection
 // taps the button before this render-blocking-delayed script (after the gstatic
 // Firebase SDK) has run. If this script never runs, the button stays safely inert.
 // ── Reliability: if the Firebase SDK failed to load (gstatic blocked / offline /
 //    SRI mismatch), wizelife-auth.js never ran and wlAuth/redirectIfLoggedIn are
 //    undefined. Don't enable the form into a silently-broken state — show a clear,
 //    localized "couldn't connect" message with a Refresh action instead.
 (function () {
   var fbOk = (typeof firebase !== 'undefined')
            && (typeof wlAuth !== 'undefined')
            && (typeof redirectIfLoggedIn === 'function');
   if (!fbOk) { _wlShowConnError(); return; }
   ["loginBtn","signupBtn"].forEach(function(id){var b=document.getElementById(id); if(b) b.disabled=false;});
   try { redirectIfLoggedIn("dashboard.html"); } catch (e) { console.error('redirectIfLoggedIn failed', e); }
 })();

 function _wlShowConnError() {
   var lang = 'en';
   try { lang = (localStorage.getItem('wl_lang') || 'he').slice(0,2); } catch (e) {}
   var M = {
     he: { msg: '⚠️ לא הצלחנו להתחבר לשרת. בדוק את החיבור לאינטרנט ונסה שוב.', btn: 'נסה שוב' },
     en: { msg: "⚠️ We couldn't connect to the server. Check your internet connection and try again.", btn: 'Try again' },
     pt: { msg: '⚠️ Não foi possível conectar ao servidor. Verifique sua conexão e tente novamente.', btn: 'Tentar de novo' },
     es: { msg: '⚠️ No pudimos conectar con el servidor. Revisa tu conexión e inténtalo de nuevo.', btn: 'Reintentar' }
   };
   var t = M[lang] || M.en;
   var card = document.querySelector('.card');
   if (!card || document.getElementById('wl-conn-error')) return;
   var box = document.createElement('div');

 // Cross-app SSO: if ?next=<url> is present and points to a trusted sub-app,
 // get the user's Firebase ID token + nick + plan and redirect there with
 // them appended to the URL fragment. Otherwise fall through to dashboard.
 async function _afterAuthRedirect() {
 // Production allow-list. NOTE: localhost was intentionally removed (2026-05-16) —
 // it created an open-redirect path where a local malicious server could steal
 // tokens via wizelife.ai/auth.html?next=http://localhost:9999/...
 // For local dev, run auth.html under a localhost host yourself.
 const SAFE_HOSTS = [
 'finsightai.github.io', 'check-deal.vercel.app', 'mastermove.vercel.app',
 'wizetravel.hf.space', 'ofirofir-wizetravel.hf.space', 'wizehealth-3ol2retcla-uc.a.run.app',
 'wizelife.ai'
 ];
 try {
 const next = new URLSearchParams(window.location.search).get('next');
 if (next) {
 const u = new URL(next, window.location.origin);
 const safe = SAFE_HOSTS.some(h => u.hostname === h || u.hostname.endsWith('.' + h));
 if (safe && wlAuth.currentUser) {
 const token = await wlAuth.currentUser.getIdToken();
 const nick = localStorage.getItem('wl_nickname') || wlAuth.currentUser.displayName || '';
 let plan = 'free';
 try {
 const d = await wlDb.collection('users').doc(wlAuth.currentUser.uid).get();
 if (d.exists && d.data().plan) plan = d.data().plan;
 } catch (e) { console.error(e); }
 const params = 'wl_token=' + encodeURIComponent(token) + '&wl_nick=' + encodeURIComponent(nick) + '&wl_plan=' + encodeURIComponent(plan);
 const sep = next.indexOf('#') === -1 ? '#' : '&';
 window.location.href = next + sep + params;
 return;
 }
 }
 } catch (e) { /* fall through */ }
 window.location.href = 'dashboard.html';
 }

 // Detect mobile / Safari / iOS — popups are blocked or unreliable there.
 // Use redirect on those, popup on desktop where it's smoother.
 function _shouldUseRedirect() {
 const ua = navigator.userAgent || "";
 const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(ua);
 const isSafari = /Safari/.test(ua) && !/Chrome|CriOS|FxiOS|EdgiOS/.test(ua);
 return isMobile || isSafari;
 }

 async function googleLogin() {
 try {
 if (_shouldUseRedirect()) {
 // Redirect flow — page reloads to Google, comes back via getRedirectResult below
 await wlAuth.signInWithRedirect(googleProvider);
 return;
 }
 const cred = await wlAuth.signInWithPopup(googleProvider);
 await _finishGoogleAuth(cred);
 } catch (e) {
 console.error("Google login failed:", e);
 // Always include the raw error code so we can diagnose unknown failures
 const code = e.code || "unknown";
 const gt = _authG();
 const reason = (
 code === "auth/popup-blocked" ? gt.popupBlocked :
 code === "auth/popup-closed-by-user" ? gt.popupClosed :
 code === "auth/unauthorized-domain" ? gt.unauthDomain :
 code === "auth/operation-not-allowed" ? gt.opNotAllowed :
 code === "auth/network-request-failed" ? gt.network :
 code === "auth/cancelled-popup-request" ? gt.cancelled :
 code === "auth/internal-error" ? gt.internal :
 code === "auth/account-exists-with-different-credential" ? gt.acctExists :
 (e.message || gt.unknown)
 );
 // Always show the code at the end — copy-paste this when reporting
 const fullMsg = `${reason}\n\n${gt.errCodeLabel}${code}\n\n${gt.reportFooter}`;
 // Auto-fallback: on popup-blocked, try redirect
 if (code === "auth/popup-blocked") {
 try { await wlAuth.signInWithRedirect(googleProvider); return; } catch (e) { console.error(e); }
 }
 alert(fullMsg);
 }
 }

 // Handle the redirect return from Google (mobile / Safari path)
 wlAuth.getRedirectResult().then(async (result) => {
 if (result && result.user) {
 try { await _finishGoogleAuth(result); } catch (e) { console.error(e); }
 }
 }).catch((e) => {
 if (e && e.code && e.code !== "auth/null-user") {
 console.error("Google redirect result error:", e);
 alert(_authG().redirectFailed + e.code);
 }
 });

 function friendlyError(code) {
 const t = _authT();
 const map = {
 // Anti-enumeration: collapse "user-not-found" + "wrong-password" into the
 // same generic message so attackers can't distinguish a real email from a
 // fake one by reading the response. (QA: security-deep-flows.js)
 "auth/user-not-found": t.errWrongCreds,
 "auth/wrong-password": t.errWrongCreds,
 "auth/invalid-credential": t.errWrongCreds,
 "auth/invalid-login-credentials": t.errWrongCreds,
 "auth/invalid-email": t.errInvalidEmail,
 "auth/email-already-in-use": t.errEmailInUse,
 "auth/weak-password": t.errWeakPw,
 "auth/too-many-requests": t.errTooMany,
 "auth/popup-closed-by-user": t.errPopupClosed,
 "auth/network-request-failed": t.errNetwork,
 "auth/user-disabled": t.errDisabled,
 "auth/operation-not-allowed": t.errOpNotAllowed,
 "auth/expired-action-code": t.errExpiredCode,
 "auth/invalid-action-code": t.errInvalidCode,
 };
 return map[code] || (t.errGeneric + " (" + (code || "unknown") + ").");
 }

function setAuthLang(v) {
 if (!['en','pt','es','he'].includes(v)) return;
 localStorage.setItem('wl_lang', v);
 const t = AUTH_TR[v];
 document.documentElement.dir = (v === 'he') ? 'rtl' : 'ltr';
 document.documentElement.lang = v;
 document.querySelectorAll('.auth-lang-pill').forEach(b => {
 const active = b.getAttribute('data-lang') === v;
 b.style.background = active ? 'rgba(99,102,241,0.18)' : 'none';
 b.style.color = active ? '#a5b4fc' : '#7b88ad';
 });
 var sel = document.getElementById('wl_lang_select');
 if (sel && sel.value !== v) sel.value = v;
 const tabL = document.getElementById('tabLogin');
 const tabS = document.getElementById('tabSignup');
 if (tabL) tabL.textContent = t.signIn;
 if (tabS) tabS.textContent = t.signUp;
 document.querySelectorAll('label').forEach(l => {
 const txt = l.textContent.trim();
 if (/email/i.test(txt)) l.textContent = t.email;
 else if (/password|סיסמה|senha|contraseña/i.test(txt)) l.textContent = t.password;
 else if (/full name|שם מלא|nome|nombre/i.test(txt)) l.textContent = t.fullName;
 });
 const loginBtn = document.getElementById('loginBtn');
 const signupBtn = document.getElementById('signupBtn');
 if (loginBtn) loginBtn.textContent = t.signInBtn;
 if (signupBtn) signupBtn.textContent = t.signUpBtn;
 const subtitle = document.querySelector('.logo p');
 if (subtitle) subtitle.textContent = t.subtitle;
 document.querySelectorAll('.forgot a').forEach(a => a.textContent = t.forgot);
 const orEl = document.getElementById('authOrDivider');
 if (orEl) orEl.textContent = t.or;
 const gEl = document.getElementById('authGoogleTxt');
 if (gEl) gEl.textContent = t.google;
 const backEl = document.getElementById('authBackLink');
 if (backEl) backEl.textContent = t.back;
}
(function() {
 const saved = localStorage.getItem('wl_lang') || 'en';
 if (document.readyState === 'loading') {
 document.addEventListener('DOMContentLoaded', function() { setAuthLang(saved); });
 } else { setAuthLang(saved); }
})();
</script>

 30–60s Render cold-start finishes before they tap a card. */
(function prewarmBackends(){
 function ping(u){ try { fetch(u, { mode:'no-cors', cache:'no-cache', credentials:'omit' }).catch(function(){}); } catch (e) { console.error(e); } }
 var TARGETS = ['https://wizehealth-3ol2retcla-uc.a.run.app/', 'https://wizetax-backend-3ol2retcla-uc.a.run.app/health', 'https://ofirofir-wizetravel.hf.space/'];
 // Fire immediately on auth page load + every 30 s. By the time user
 // signs in and reaches dashboard, every backend is hot.
 TARGETS.forEach(ping);
 setInterval(function(){ if (document.visibilityState === 'visible') TARGETS.forEach(ping); }, 30 * 1000);
})();
