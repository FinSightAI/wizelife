<script>
(function(){try{
 // Unified language: URL ?lang (cross-app handoff) → saved wl_lang → browser → English.
 var _V=['he','en','pt','es'];
 var _u=new URLSearchParams(location.search).get('lang');
 if(_u&&_V.indexOf(_u)>=0){localStorage.setItem('wl_lang',_u);}
 else if(!localStorage.getItem('wl_lang')){var _bl=(navigator.language||'en').slice(0,2).toLowerCase();localStorage.setItem('wl_lang',(['he','pt','es'].indexOf(_bl)>=0)?_bl:'en');}
 var t=localStorage.getItem('wl_theme');
 var isLight=t==='light';
 document.documentElement.setAttribute('data-theme',isLight?'light':'dark');
 document.documentElement.classList.add(isLight?'light':'dark');
 document.documentElement.classList.remove(isLight?'dark':'light');
 if(document.body){document.body.classList.add(isLight?'light':'dark');document.body.classList.remove(isLight?'dark':'light');}
 document.addEventListener('DOMContentLoaded',function(){
 document.body.classList.add(isLight?'light':'dark');
 document.body.classList.remove(isLight?'dark':'light');
 });
 // Apply saved language direction before paint to prevent RTL flash for non-Hebrew users.
 var v = (localStorage.getItem('wl_lang') || 'he').slice(0,2);
 if(['he','en','pt','es'].indexOf(v)>=0){
 document.documentElement.dir = (v==='he') ? 'rtl' : 'ltr';
 document.documentElement.lang = v;
 }
}catch(e){console.error(e);}})();
</script>

<script>
 redirectIfLoggedIn("dashboard.html");

 function switchTab(tab) {
 document.getElementById("loginForm").style.display = tab === "login" ? "" : "none";
 document.getElementById("signupForm").style.display = tab === "signup" ? "" : "none";
 document.getElementById("tabLogin").classList.toggle("active", tab === "login");
 document.getElementById("tabSignup").classList.toggle("active", tab === "signup");
 }

 function setLoading(btnId, loading) {
 document.getElementById(btnId).disabled = loading;
 document.getElementById(btnId).textContent = loading ? "Please wait…" : (btnId === "loginBtn" ? "Sign In" : "Create Account");
 }

 function togglePw(id, btn) {
 const el = document.getElementById(id);
 if (!el) return;
 if (el.type === 'password') { el.type = 'text'; btn.textContent = '🙈'; }
 else { el.type = 'password'; btn.textContent = '👁'; }
 }

 async function emailLogin() {
 const email = document.getElementById("loginEmail").value.trim();
 const pass = document.getElementById("loginPassword").value.trim();
 document.getElementById("loginError").textContent = "";
 setLoading("loginBtn", true);
 try {
 const cred = await wlAuth.signInWithEmailAndPassword(email, pass);
 if (!cred.user.emailVerified) {
 setLoading("loginBtn", false);
 _showVerifyScreen(email);
 return;
 }
 try { await window.WizeTrack?.login({ method: 'email' }); } catch (e) { console.error(e); }
 await _afterAuthRedirect();
 } catch (e) {
 document.getElementById("loginError").textContent = friendlyError(e.code);
 setLoading("loginBtn", false);
 }
 }

 function validatePassword(pass) {
 if (pass.length < 8) return "Password must be at least 8 characters.";
 if (!/[A-Z]/.test(pass)) return "Password must contain at least one uppercase letter (A-Z).";
 if (!/[a-z]/.test(pass)) return "Password must contain at least one lowercase letter (a-z).";
 if (!/[0-9]/.test(pass)) return "Password must contain at least one digit (0-9).";
 if (!/[^A-Za-z0-9]/.test(pass)) return "Password must contain at least one special character (!@#$% etc.).";
 return null;
 }

 async function emailSignup() {
 const name = document.getElementById("signupName").value.trim();
 const email = document.getElementById("signupEmail").value.trim();
 const pass = document.getElementById("signupPassword").value.trim();
 document.getElementById("signupError").textContent = "";

 if (!name || name.length < 2) {
 document.getElementById("signupError").textContent = "Please enter a nickname (at least 2 characters).";
 document.getElementById("signupName").focus();
 return;
 }
 if (name.includes('@')) {
 document.getElementById("signupError").textContent = "Nickname can't be an email — pick a name you want to be called.";
 document.getElementById("signupName").focus();
 return;
 }
 const passError = validatePassword(pass);
 if (passError) {
 document.getElementById("signupError").textContent = passError;
 return;
 }

 setLoading("signupBtn", true);
 try {
 const cred = await wlAuth.createUserWithEmailAndPassword(email, pass);

 async function _finishGoogleAuth(cred) {
 const ref = wlDb.collection("users").doc(cred.user.uid);
 const doc = await ref.get();
 const nick = cred.user.displayName || cred.user.email.split("@")[0];
 if (!doc.exists) {
 await ref.set({ plan: "free", nickname: nick, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
 try { await applyReferralOnSignup(cred.user.uid); } catch (e) { console.error(e); }
 try { await window.WizeTrack?.signup({ method: 'google' }); } catch (e) { console.error(e); }
 } else {
 const d = doc.data();
 if (!d.nickname) await ref.update({ nickname: nick });
 try { await window.WizeTrack?.login({ method: 'google' }); } catch (e) { console.error(e); }
 }
 localStorage.setItem("wl_nickname", (doc.exists && doc.data().nickname) ? doc.data().nickname : nick);
 await _afterAuthRedirect();
 }

 // Cross-app SSO: if ?next=<url> is present and points to a trusted sub-app,
 // get the user's Firebase ID token + nick + plan and redirect there with
 // them appended to the URL fragment. Otherwise fall through to dashboard.
 async function _afterAuthRedirect() {
 // Production allow-list. NOTE: localhost was intentionally removed (2026-05-16) —
 // it created an open-redirect path where a local malicious server could steal
 // tokens via wizelife.ai/auth.html?next=http://localhost:9999/...
 // For local dev, run auth.html under a localhost host yourself.
 const SAFE_HOSTS = [
 'finsightai.github.io', 'check-deal.vercel.app', 'mastermove.vercel.app',
 'wizetravel.hf.space', 'ofirofir-wizetravel.hf.space', 'wizehealth-3ol2retcla-uc.a.run.app',
 'wizelife.ai'
 ];
 try {
 const next = new URLSearchParams(window.location.search).get('next');
 if (next) {
 const u = new URL(next, window.location.origin);
 const safe = SAFE_HOSTS.some(h => u.hostname === h || u.hostname.endsWith('.' + h));
 if (safe && wlAuth.currentUser) {
 const token = await wlAuth.currentUser.getIdToken();
 const nick = localStorage.getItem('wl_nickname') || wlAuth.currentUser.displayName || '';
 let plan = 'free';
 try {
 const d = await wlDb.collection('users').doc(wlAuth.currentUser.uid).get();
 if (d.exists && d.data().plan) plan = d.data().plan;
 } catch (e) { console.error(e); }
 const params = 'wl_token=' + encodeURIComponent(token) + '&wl_nick=' + encodeURIComponent(nick) + '&wl_plan=' + encodeURIComponent(plan);
 const sep = next.indexOf('#') === -1 ? '#' : '&';
 window.location.href = next + sep + params;
 return;
 }
 }
 } catch (e) { /* fall through */ }
 window.location.href = 'dashboard.html';
 }

 // Detect mobile / Safari / iOS — popups are blocked or unreliable there.
 // Use redirect on those, popup on desktop where it's smoother.
 function _shouldUseRedirect() {
 const ua = navigator.userAgent || "";
 const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(ua);
 const isSafari = /Safari/.test(ua) && !/Chrome|CriOS|FxiOS|EdgiOS/.test(ua);
 return isMobile || isSafari;
 }

 async function googleLogin() {
 try {
 if (_shouldUseRedirect()) {
 // Redirect flow — page reloads to Google, comes back via getRedirectResult below
 await wlAuth.signInWithRedirect(googleProvider);
 return;
 }
 const cred = await wlAuth.signInWithPopup(googleProvider);
 await _finishGoogleAuth(cred);
 } catch (e) {
 console.error("Google login failed:", e);
 // Always include the raw error code so we can diagnose unknown failures
 const code = e.code || "unknown";
 const reason = (
 code === "auth/popup-blocked" ? "הדפדפן חסם את החלון" :
 code === "auth/popup-closed-by-user" ? "ביטלת את ההתחברות" :
 code === "auth/unauthorized-domain" ? "הדומיין הזה לא מורשה ב-Firebase" :
 code === "auth/operation-not-allowed" ? "Google sign-in לא מופעל ב-Firebase Console" :
 code === "auth/network-request-failed" ? "תקלת רשת. בדוק חיבור אינטרנט" :
 code === "auth/cancelled-popup-request" ? "Popup קודם בוטל. רענן ונסה שוב" :
 code === "auth/internal-error" ? "שגיאה פנימית של Firebase" :
 code === "auth/account-exists-with-different-credential" ? "כבר נרשמת עם email/password באימייל הזה" :
 (e.message || "שגיאה לא ידועה")
 );
 // Always show the code at the end — copy-paste this when reporting
 const fullMsg = `${reason}\n\nקוד שגיאה: ${code}\n\nצלם והעבר ל-hi@wizelife.ai אם זה ממשיך`;
 // Auto-fallback: on popup-blocked, try redirect
 if (code === "auth/popup-blocked") {
 try { await wlAuth.signInWithRedirect(googleProvider); return; } catch (e) { console.error(e); }
 }
 alert(fullMsg);
 }
 }

 // Handle the redirect return from Google (mobile / Safari path)
 wlAuth.getRedirectResult().then(async (result) => {
 if (result && result.user) {
 try { await _finishGoogleAuth(result); } catch (e) { console.error(e); }
 }
 }).catch((e) => {
 if (e && e.code && e.code !== "auth/null-user") {
 console.error("Google redirect result error:", e);
 alert("Google sign-in failed: " + e.code);
 }
 });

 function friendlyError(code) {
 const map = {
 // Anti-enumeration: collapse "user-not-found" + "wrong-password" into the
 // same generic message so attackers can't distinguish a real email from a
 // fake one by reading the response. (QA: security-deep-flows.js)
 "auth/user-not-found": "Wrong email or password — check for caps-lock or trailing spaces.",
 "auth/wrong-password": "Wrong email or password — check for caps-lock or trailing spaces.",
 "auth/invalid-credential": "Wrong email or password — check for caps-lock or trailing spaces.",
 "auth/invalid-login-credentials":"Wrong email or password — check for caps-lock or trailing spaces.",
 "auth/invalid-email": "Invalid email address.",
 "auth/email-already-in-use": "This email is already registered. Try signing in.",
 "auth/weak-password": "Password must be at least 8 characters with uppercase and special character.",
 "auth/too-many-requests": "Too many attempts. Try again in a few minutes — or use \"Forgot password\".",
 "auth/popup-closed-by-user": "Sign-in cancelled.",
 "auth/network-request-failed": "Network problem — check your connection.",
 "auth/user-disabled": "This account is disabled. Contact support.",
 "auth/operation-not-allowed": "Email/password sign-in is disabled.",
 "auth/expired-action-code": "This reset link expired. Click \"Forgot password\" to get a new one.",
 "auth/invalid-action-code": "This reset link is invalid or already used. Request a new one.",
 };
 return map[code] || ("Something went wrong (" + (code || "unknown") + "). Please try again.");
 }

 function togglePw(inputId, btn) {
 const input = document.getElementById(inputId);
 const show = input.type === "password";
 input.type = show ? "text" : "password";
 btn.textContent = show ? "🙈" : "👁";
 }

 async function forgotPassword() {
 const email = document.getElementById("loginEmail").value.trim();
 if (!email) {
 document.getElementById("loginError").textContent = "Enter your email above first.";
 document.getElementById("loginEmail").focus();
 return;
 }
 // Anti-enumeration: ALWAYS show the same success message, regardless of
 // whether the email is actually registered. Firebase will throw
 // auth/user-not-found for unregistered emails — we swallow that specific
 // error (and only that one) so attackers can't distinguish.
 // QA: security-deep-flows.js flagged this as account enumeration risk.
 try {
 await wlAuth.sendPasswordResetEmail(email);
 } catch (e) {
 if (e && (e.code === 'auth/user-not-found' || e.code === 'auth/invalid-email')) {
 // Silently swallow — do NOT reveal that the email is unregistered/invalid.
 // The user gets the same success message; the attacker gains nothing.
 } else {
 // Surface real errors (network/quota) without leaking existence.
 document.getElementById("loginError").style.color = "";
 document.getElementById("loginError").textContent = friendlyError(e.code) || "Something went wrong — try again.";
 return;
 }
 }
 document.getElementById("loginError").style.color = "#34d399";
 document.getElementById("loginError").textContent = "If an account exists for that email, a reset link was sent — check your inbox.";
 }

 // Allow Enter key
 document.addEventListener("keydown", e => {
 if (e.key !== "Enter") return;
 const loginVisible = document.getElementById("loginForm").style.display !== "none";
 if (loginVisible) emailLogin(); else emailSignup();
 });

<script>
/* Pre-warm Render-hosted backends from auth.html too. The user is about to
 sign in and head to the dashboard / a tool — start the wake-up now so the
 30–60s Render cold-start finishes before they tap a card. */
(function prewarmBackends(){
 function ping(u){ try { fetch(u, { mode:'no-cors', cache:'no-cache', credentials:'omit' }).catch(function(){}); } catch (e) { console.error(e); } }
 var TARGETS = ['https://wizehealth-3ol2retcla-uc.a.run.app/', 'https://wizetax-backend-3ol2retcla-uc.a.run.app/health', 'https://ofirofir-wizetravel.hf.space/'];
 // Fire immediately on auth page load + every 30 s. By the time user
 // signs in and reaches dashboard, every backend is hot.
 TARGETS.forEach(ping);
 setInterval(function(){ if (document.visibilityState === 'visible') TARGETS.forEach(ping); }, 30 * 1000);
})();
