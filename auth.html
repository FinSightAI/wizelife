<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #050810; --bg2: #0d1117; --bg3: #161b27;
    --border: rgba(255,255,255,0.08); --text: #f0f4ff; --muted: #8892a4;
    --accent: #6366f1; --accent2: #8b5cf6;
  }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }

  .card {
    background: var(--bg2); border: 1px solid var(--border); border-radius: 24px;
    padding: 48px 40px; width: 100%; max-width: 420px;
    box-shadow: 0 32px 80px rgba(0,0,0,0.5);
  }

  .logo { text-align: center; margin-bottom: 32px; }
  .logo a { text-decoration: none; font-size: 1.5rem; font-weight: 800; color: var(--text); }
  .logo a span { color: var(--accent); }
  .logo p { color: var(--muted); font-size: 0.9rem; margin-top: 6px; }

  .tabs { display: flex; background: var(--bg3); border-radius: 12px; padding: 4px; margin-bottom: 28px; }
  .tab { flex: 1; text-align: center; padding: 10px; border-radius: 9px; cursor: pointer; font-size: 0.9rem; font-weight: 600; color: var(--muted); transition: all 0.2s; }
  .tab.active { background: var(--bg2); color: var(--text); box-shadow: 0 2px 8px rgba(0,0,0,0.3); }

  .form-group { margin-bottom: 16px; }
  label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
  input {
    width: 100%; padding: 12px 14px; background: var(--bg3);
    border: 1px solid var(--border); border-radius: 10px;
    color: var(--text); font-size: 0.95rem; font-family: inherit;
    transition: border-color 0.2s;
  }
  input:focus { outline: none; border-color: var(--accent); }
  input::placeholder { color: var(--muted); }

  .btn-primary {
    width: 100%; padding: 14px; margin-top: 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff; font-size: 1rem; font-weight: 700;
    border: none; border-radius: 12px; cursor: pointer;
    transition: opacity 0.2s;
  }
  .btn-primary:hover { opacity: 0.88; }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

  .divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; color: var(--muted); font-size: 0.8rem; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .btn-google {
    width: 100%; padding: 13px; background: var(--bg3);
    border: 1px solid var(--border); border-radius: 12px;
    color: var(--text); font-size: 0.95rem; font-weight: 600;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
    transition: background 0.2s;
  }
  .btn-google:hover { background: var(--border); }
  .btn-google img { width: 20px; height: 20px; }

  .error { color: #f87171; font-size: 0.83rem; margin-top: 10px; text-align: center; min-height: 20px; }
  .back { text-align: center; margin-top: 24px; }
  .back a { color: var(--muted); font-size: 0.85rem; text-decoration: none; }
  .back a:hover { color: var(--text); }

  .pw-wrap { position: relative; }
  .pw-wrap input { padding-right: 42px; }
  .pw-toggle {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; color: var(--muted);
    font-size: 1rem; line-height: 1; padding: 4px;
    transition: color 0.15s;
  }
  .pw-toggle:hover { color: var(--text); }

  .forgot { text-align: right; margin-top: 6px; }
  .forgot a { color: var(--muted); font-size: 0.8rem; text-decoration: none; }
  .forgot a:hover { color: var(--accent); }
</style>

<script>
  redirectIfLoggedIn("dashboard.html");

  function switchTab(tab) {
    document.getElementById("loginForm").style.display  = tab === "login"  ? "" : "none";
    document.getElementById("signupForm").style.display = tab === "signup" ? "" : "none";
    document.getElementById("tabLogin").classList.toggle("active",  tab === "login");
    document.getElementById("tabSignup").classList.toggle("active", tab === "signup");
  }

  function setLoading(btnId, loading) {
    document.getElementById(btnId).disabled = loading;
    document.getElementById(btnId).textContent = loading ? "Please wait…" : (btnId === "loginBtn" ? "Sign In" : "Create Account");
  }

  function togglePw(id, btn) {
    const el = document.getElementById(id);
    if (!el) return;
    if (el.type === 'password') { el.type = 'text';  btn.textContent = '🙈'; }
    else                        { el.type = 'password'; btn.textContent = '👁'; }
  }

  async function emailLogin() {
    const email = document.getElementById("loginEmail").value.trim();
    const pass  = document.getElementById("loginPassword").value.trim();
    document.getElementById("loginError").textContent = "";
    setLoading("loginBtn", true);
    try {
      await wlAuth.signInWithEmailAndPassword(email, pass);
      window.location.href = "dashboard.html";
    } catch (e) {
      document.getElementById("loginError").textContent = friendlyError(e.code);
      setLoading("loginBtn", false);
    }
  }

  function validatePassword(pass) {
    if (pass.length < 8)             return "Password must be at least 8 characters.";
    if (!/[A-Z]/.test(pass))         return "Password must contain at least one uppercase letter (A-Z).";
    if (!/[a-z]/.test(pass))         return "Password must contain at least one lowercase letter (a-z).";
    if (!/[0-9]/.test(pass))         return "Password must contain at least one digit (0-9).";
    if (!/[^A-Za-z0-9]/.test(pass))  return "Password must contain at least one special character (!@#$% etc.).";
    return null;
  }

  async function emailSignup() {
    const name  = document.getElementById("signupName").value.trim();
    const email = document.getElementById("signupEmail").value.trim();
    const pass  = document.getElementById("signupPassword").value.trim();
    document.getElementById("signupError").textContent = "";

    if (!name || name.length < 2) {
      document.getElementById("signupError").textContent = "Please enter a nickname (at least 2 characters).";
      document.getElementById("signupName").focus();
      return;
    }
    if (name.includes('@')) {
      document.getElementById("signupError").textContent = "Nickname can't be an email — pick a name you want to be called.";
      document.getElementById("signupName").focus();
      return;
    }
    const passError = validatePassword(pass);
    if (passError) {
      document.getElementById("signupError").textContent = passError;
      return;
    }

    setLoading("signupBtn", true);
    try {
      const cred = await wlAuth.createUserWithEmailAndPassword(email, pass);
      await cred.user.updateProfile({ displayName: name });
      await wlDb.collection("users").doc(cred.user.uid).set({
        plan: "free",
        nickname: name,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true });
      localStorage.setItem("wl_nickname", name);
      try { await applyReferralOnSignup(cred.user.uid); } catch {}
      window.location.href = "dashboard.html";
    } catch (e) {
      document.getElementById("signupError").textContent = friendlyError(e.code);
      setLoading("signupBtn", false);
    }
  }

  async function _finishGoogleAuth(cred) {
    const ref = wlDb.collection("users").doc(cred.user.uid);
    const doc = await ref.get();
    const nick = cred.user.displayName || cred.user.email.split("@")[0];
    if (!doc.exists) {
      await ref.set({ plan: "free", nickname: nick, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
      try { await applyReferralOnSignup(cred.user.uid); } catch {}
    } else {
      const d = doc.data();
      if (!d.nickname) await ref.update({ nickname: nick });
    }
    localStorage.setItem("wl_nickname", (doc.exists && doc.data().nickname) ? doc.data().nickname : nick);
    window.location.href = "dashboard.html";
  }

  // Detect mobile / Safari / iOS — popups are blocked or unreliable there.
  // Use redirect on those, popup on desktop where it's smoother.
  function _shouldUseRedirect() {
    const ua = navigator.userAgent || "";
    const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(ua);
    const isSafari = /Safari/.test(ua) && !/Chrome|CriOS|FxiOS|EdgiOS/.test(ua);
    return isMobile || isSafari;
  }

  async function googleLogin() {
    try {
      if (_shouldUseRedirect()) {
        // Redirect flow — page reloads to Google, comes back via getRedirectResult below
        await wlAuth.signInWithRedirect(googleProvider);
        return;
      }
      const cred = await wlAuth.signInWithPopup(googleProvider);
      await _finishGoogleAuth(cred);
    } catch (e) {
      console.error("Google login failed:", e);
      // Always include the raw error code so we can diagnose unknown failures
      const code = e.code || "unknown";
      const reason = (
        code === "auth/popup-blocked"           ? "הדפדפן חסם את החלון" :
        code === "auth/popup-closed-by-user"    ? "ביטלת את ההתחברות" :
        code === "auth/unauthorized-domain"     ? "הדומיין הזה לא מורשה ב-Firebase" :
        code === "auth/operation-not-allowed"   ? "Google sign-in לא מופעל ב-Firebase Console" :
        code === "auth/network-request-failed"  ? "תקלת רשת. בדוק חיבור אינטרנט" :
        code === "auth/cancelled-popup-request" ? "Popup קודם בוטל. רענן ונסה שוב" :
        code === "auth/internal-error"          ? "שגיאה פנימית של Firebase" :
        code === "auth/account-exists-with-different-credential" ? "כבר נרשמת עם email/password באימייל הזה" :
        (e.message || "שגיאה לא ידועה")
      );
      // Always show the code at the end — copy-paste this when reporting
      const fullMsg = `${reason}\n\nקוד שגיאה: ${code}\n\nצלם והעבר ל-hi@wizelife.ai אם זה ממשיך`;
      // Auto-fallback: on popup-blocked, try redirect
      if (code === "auth/popup-blocked") {
        try { await wlAuth.signInWithRedirect(googleProvider); return; } catch {}
      }
      alert(fullMsg);
    }
  }

  // Handle the redirect return from Google (mobile / Safari path)
  wlAuth.getRedirectResult().then(async (result) => {
    if (result && result.user) {
      try { await _finishGoogleAuth(result); } catch (e) { console.error(e); }
    }
  }).catch((e) => {
    if (e && e.code && e.code !== "auth/null-user") {
      console.error("Google redirect result error:", e);
      alert("Google sign-in failed: " + e.code);
    }
  });

  function friendlyError(code) {
    const map = {
      "auth/user-not-found":           "No account with this email.",
      "auth/wrong-password":           "Wrong password — check for caps-lock or trailing spaces.",
      "auth/invalid-credential":       "Wrong email or password — check for caps-lock or trailing spaces.",
      "auth/invalid-login-credentials":"Wrong email or password — check for caps-lock or trailing spaces.",
      "auth/invalid-email":            "Invalid email address.",
      "auth/email-already-in-use":     "This email is already registered. Try signing in.",
      "auth/weak-password":            "Password must be at least 8 characters with uppercase and special character.",
      "auth/too-many-requests":        "Too many attempts. Try again in a few minutes — or use \"Forgot password\".",
      "auth/popup-closed-by-user":     "Sign-in cancelled.",
      "auth/network-request-failed":   "Network problem — check your connection.",
      "auth/user-disabled":            "This account is disabled. Contact support.",
      "auth/operation-not-allowed":    "Email/password sign-in is disabled.",
      "auth/expired-action-code":      "This reset link expired. Click \"Forgot password\" to get a new one.",
      "auth/invalid-action-code":      "This reset link is invalid or already used. Request a new one.",
    };
    return map[code] || ("Something went wrong (" + (code || "unknown") + "). Please try again.");
  }

  function togglePw(inputId, btn) {
    const input = document.getElementById(inputId);
    const show = input.type === "password";
    input.type = show ? "text" : "password";
    btn.textContent = show ? "🙈" : "👁";
  }

  async function forgotPassword() {
    const email = document.getElementById("loginEmail").value.trim();
    if (!email) {
      document.getElementById("loginError").textContent = "Enter your email above first.";
      document.getElementById("loginEmail").focus();
      return;
    }
    try {
      await wlAuth.sendPasswordResetEmail(email);
      document.getElementById("loginError").style.color = "#34d399";
      document.getElementById("loginError").textContent = "Reset email sent — check your inbox.";
    } catch (e) {
      document.getElementById("loginError").style.color = "";
      document.getElementById("loginError").textContent = friendlyError(e.code);
    }
  }

  // Allow Enter key
  document.addEventListener("keydown", e => {
    if (e.key !== "Enter") return;
    const loginVisible = document.getElementById("loginForm").style.display !== "none";
    if (loginVisible) emailLogin(); else emailSignup();
  });
</script>

<script>
const AUTH_TR = {
  he: { signIn: 'כניסה', signUp: 'יצירת חשבון', email: 'אימייל', password: 'סיסמה', fullName: 'שם מלא', forgot: 'שכחת סיסמה?', subtitle: 'הסוויטה לחיים מבוססת AI', signInBtn: 'כניסה', signUpBtn: 'הרשמה' },
  en: { signIn: 'Sign In', signUp: 'Create Account', email: 'Email', password: 'Password', fullName: 'Full Name', forgot: 'Forgot password?', subtitle: 'Your AI-powered life suite', signInBtn: 'Sign In', signUpBtn: 'Create Account' },
  pt: { signIn: 'Entrar', signUp: 'Criar Conta', email: 'Email', password: 'Senha', fullName: 'Nome Completo', forgot: 'Esqueceu a senha?', subtitle: 'Sua suíte de vida com IA', signInBtn: 'Entrar', signUpBtn: 'Criar Conta' },
  es: { signIn: 'Iniciar Sesión', signUp: 'Crear Cuenta', email: 'Email', password: 'Contraseña', fullName: 'Nombre Completo', forgot: '¿Olvidaste la contraseña?', subtitle: 'Tu suite de vida con IA', signInBtn: 'Iniciar Sesión', signUpBtn: 'Crear Cuenta' },
};
function setAuthLang(v) {
  if (!['en','pt','es','he'].includes(v)) return;
  localStorage.setItem('wl_lang', v);
  const t = AUTH_TR[v];
  document.documentElement.dir = (v === 'he') ? 'rtl' : 'ltr';
  document.documentElement.lang = v;
  document.querySelectorAll('.auth-lang-pill').forEach(b => {
    const active = b.getAttribute('data-lang') === v;
    b.style.background = active ? 'rgba(99,102,241,0.18)' : 'none';
    b.style.color = active ? '#a5b4fc' : '#7b88ad';
  });
  var sel = document.getElementById('wl_lang_select');
  if (sel && sel.value !== v) sel.value = v;
  const tabL = document.getElementById('tabLogin');
  const tabS = document.getElementById('tabSignup');
  if (tabL) tabL.textContent = t.signIn;
  if (tabS) tabS.textContent = t.signUp;
  document.querySelectorAll('label').forEach(l => {
    const txt = l.textContent.trim();
    if (/email/i.test(txt)) l.textContent = t.email;
    else if (/password|סיסמה|senha|contraseña/i.test(txt)) l.textContent = t.password;
    else if (/full name|שם מלא|nome|nombre/i.test(txt)) l.textContent = t.fullName;
  });
  const loginBtn = document.getElementById('loginBtn');
  const signupBtn = document.getElementById('signupBtn');
  if (loginBtn) loginBtn.textContent = t.signInBtn;
  if (signupBtn) signupBtn.textContent = t.signUpBtn;
  const subtitle = document.querySelector('.logo p');
  if (subtitle) subtitle.textContent = t.subtitle;
  document.querySelectorAll('.forgot a').forEach(a => a.textContent = t.forgot);
}
(function() {
  const saved = localStorage.getItem('wl_lang') || 'en';
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() { setAuthLang(saved); });
  } else { setAuthLang(saved); }
})();
</script>
<script>
/* Pre-warm Render-hosted backends from auth.html too. The user is about to
   sign in and head to the dashboard / a tool — start the wake-up now so the
   30–60s Render cold-start finishes before they tap a card. */
(function prewarmBackends(){
  function ping(u){ try { fetch(u, { mode:'no-cors', cache:'no-cache', credentials:'omit' }).catch(function(){}); } catch(e){} }
  var TARGETS = ['https://vitara.onrender.com/', 'https://master-backend-79jx.onrender.com/health', 'https://ofirofir-wizetravel.hf.space/'];
  // Fire immediately on auth page load + every 30 s. By the time user
  // signs in and reaches dashboard, every backend is hot.
  TARGETS.forEach(ping);
  setInterval(function(){ if (document.visibilityState === 'visible') TARGETS.forEach(ping); }, 30 * 1000);
})();
</script>
